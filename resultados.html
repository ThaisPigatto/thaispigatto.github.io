<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Painel de Resultados · Grupo Pigatto</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --navy:#003265; --orange:#F7941D;
  --fam:#BAE2F7; --fam-deep:#2B8AC4;
  --ink:#0E2A47; --muted:#5B6B80; --line:#E3E9F0;
  --bg:#FFFFFF; --panel:#F6F9FC;
  --ok:#2E9E4F; --warn:#D99400; --bad:#D64545;
  --ok-bg:#E3F5E8; --bad-bg:#FCE7E7;
  --logo-plate:transparent;
  --display:"Sora","Segoe UI",system-ui,sans-serif;
  --body:"Figtree","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ink:#E8EFF7; --muted:#9AA9BC; --line:#22344B; --bg:#0D1B2C; --panel:#13253A;
    --fam:#1E4F72; --fam-deep:#6CC0F0; --ok-bg:#163A25; --bad-bg:#3E1E22; --logo-plate:#FFFFFF;
  }
}
:root[data-theme="dark"]{
  --ink:#E8EFF7; --muted:#9AA9BC; --line:#22344B; --bg:#0D1B2C; --panel:#13253A;
  --fam:#1E4F72; --fam-deep:#6CC0F0; --ok-bg:#163A25; --bad-bg:#3E1E22; --logo-plate:#FFFFFF;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
.wrap{max-width:1180px;margin:0 auto;padding:28px 28px 48px}

/* header */
header{display:flex;align-items:center;justify-content:space-between;gap:24px;flex-wrap:wrap;padding-bottom:18px;border-bottom:3px solid var(--navy)}
.logo{background:var(--logo-plate);border-radius:10px;padding:4px 8px;display:flex}
.logo img{mix-blend-mode:multiply;height:68px;width:auto;display:block}
.title{text-align:right}
.title h1{font-family:var(--display);font-weight:800;font-size:clamp(22px,3vw,30px);margin:0;letter-spacing:-.01em;color:var(--ink)}
.title p{margin:2px 0 0;color:var(--muted);font-size:15px}
.families{display:flex;gap:6px;flex-wrap:wrap;margin:16px 0 26px}
.families span{font-size:13px;font-weight:600;padding:5px 12px;border-radius:999px;background:var(--c);color:#1d2b3a;opacity:.38}
.families span.on{opacity:1;box-shadow:inset 0 0 0 2px var(--fam-deep)}

/* hero */
.hero{display:grid;grid-template-columns:1.35fr 1fr;gap:28px;align-items:center;background:var(--panel);border-radius:18px;padding:26px 28px;border-left:8px solid var(--fam-deep)}
.hero h2{font-family:var(--display);font-size:17px;font-weight:600;margin:0 0 14px;color:var(--muted)}
.pill{position:relative;height:64px;border-radius:16px;background:var(--fam);overflow:hidden}
.pill .fill{position:absolute;inset:0 auto 0 0;background:var(--fam-deep);opacity:.9;border-radius:16px 0 0 16px}
.pill .meta-tick{position:absolute;top:0;bottom:0;right:0;width:4px;background:var(--navy)}
.pill b{position:absolute;left:20px;top:50%;transform:translateY(-50%);font-family:var(--display);font-size:32px;font-weight:800;color:#fff}
.pill small{position:absolute;right:16px;top:50%;transform:translateY(-50%);font-weight:600;font-size:14px;color:var(--ink)}
.nums{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.nums div{background:var(--bg);border-radius:12px;padding:12px 14px}
.nums span{display:block;font-size:13px;color:var(--muted)}
.nums strong{font-family:var(--display);font-size:22px;font-weight:700;white-space:nowrap}
.nums .gap strong{color:var(--bad)}

section{margin-top:34px}
section > h3{font-family:var(--display);font-size:20px;font-weight:700;margin:0 0 4px}
section > p.sub{margin:0 0 16px;color:var(--muted);font-size:15px}

/* meses */
.months{display:grid;gap:14px}
.month{display:grid;grid-template-columns:110px 1fr 220px;gap:18px;align-items:center}
.month .name{font-family:var(--display);font-weight:700;font-size:18px}
.bar{position:relative;height:44px;border-radius:12px;background:var(--fam);overflow:hidden}
.bar .fill{position:absolute;inset:0 auto 0 0;border-radius:12px 0 0 12px}
.bar b{position:absolute;left:14px;top:50%;transform:translateY(-50%);font-family:var(--display);font-weight:800;font-size:20px;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.25)}
.month .val{font-size:15px;color:var(--muted)}
.month .val strong{color:var(--ink);font-size:17px;display:block}
.ok{background:var(--ok)} .warn{background:var(--warn)} .bad{background:var(--bad)}
.legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:12px;font-size:13px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}

/* tabela */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px}
table{width:100%;border-collapse:collapse;min-width:720px;font-variant-numeric:tabular-nums}
th,td{padding:11px 14px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
thead th{font-family:var(--display);font-weight:600;font-size:14px;background:var(--navy);color:#fff}
tr.group td{background:var(--panel);font-family:var(--display);font-weight:700;font-size:14px;text-align:left;padding-top:14px}
tr.group td em{font-style:normal;font-family:var(--body);font-weight:500;color:var(--muted);margin-left:8px}
tbody tr:last-child td{border-bottom:0}
td.set{font-weight:700}
.tag{display:inline-block;min-width:74px;text-align:center;font-size:13px;font-weight:700;padding:3px 10px;border-radius:999px}
.tag.y{background:var(--ok-bg);color:var(--ok)} .tag.n{background:var(--bad-bg);color:var(--bad)}
sup{color:var(--orange);font-weight:700}

/* leitura */
.reads{display:grid;grid-template-columns:1fr;gap:12px}
.read{display:grid;grid-template-columns:190px 1fr;column-gap:24px;align-items:start;border:1px solid var(--line);border-radius:14px;padding:18px 22px;border-left:6px solid var(--fam-deep)}
.read .big{grid-row:1 / span 3;align-self:center}
.read h4,.read p,.read .chips{grid-column:2}
@media (max-width:640px){.read{grid-template-columns:1fr}.read .big{grid-row:auto}.read h4,.read p,.read .chips{grid-column:1}}
.read .big{font-family:var(--display);font-size:26px;font-weight:800;color:var(--navy)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .read .big{color:var(--fam-deep)}}
:root[data-theme="dark"] .read .big{color:var(--fam-deep)}
.read h4{margin:2px 0 6px;font-size:16px;font-weight:700}
.read p{margin:0;color:var(--muted);font-size:15px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chips span{font-size:13px;background:var(--panel);border:1px solid var(--line);padding:3px 10px;border-radius:999px}

/* foco */
.focus{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;counter-reset:f}
.focus > div{background:var(--navy);color:#fff;border-radius:14px;padding:18px 20px}
.focus > div::before{counter-increment:f;content:counter(f);display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--orange);color:#fff;font-family:var(--display);font-weight:800;margin-bottom:10px}
.focus h4{margin:0 0 6px;font-family:var(--display);font-size:16px}
.focus p{margin:0;font-size:14.5px;opacity:.85}
.focus .owner{margin-top:12px;font-size:13px;opacity:.75;border-top:1px solid rgba(255,255,255,.2);padding-top:8px}

footer{margin-top:34px;padding-top:14px;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}
footer p{margin:3px 0}

@media (max-width:820px){
  .hero{grid-template-columns:1fr}
  .title{text-align:left}
  .month{grid-template-columns:1fr;gap:6px}
  .reads,.focus{grid-template-columns:1fr}
  .nums{grid-template-columns:1fr 1fr 1fr}
}
@media (max-width:480px){.nums{grid-template-columns:1fr}.wrap{padding:20px 16px 36px}}
@media print{body{-webkit-print-color-adjust:exact;print-color-adjust:exact}.wrap{padding:0}section{break-inside:avoid}}
/* v2: seletor de visão, pendências e grupos por tópico */
.toolbar{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin:-8px 0 22px}
.seg{display:inline-flex;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:4px;gap:4px}
.seg button{font:600 14px var(--body);color:var(--muted);background:transparent;border:0;border-radius:9px;padding:9px 16px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--navy);color:#fff}
.seg button:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
.view-note{font-size:14px;color:var(--muted)}
.view-note strong{color:var(--orange)}
.pending-bar{background:repeating-linear-gradient(135deg,var(--fam) 0 10px,var(--panel) 10px 20px)}
.pending-bar b,.pill.pending-bar b{color:var(--muted);text-shadow:none;font-family:var(--body);font-weight:600;font-size:15px}
.pill.pending-bar b{font-size:17px}
td.pend{color:var(--muted);font-size:13px;font-style:italic}
td.na{color:var(--muted)}
.center-title{text-align:center;font-size:clamp(26px,3.4vw,34px)!important;margin-bottom:6px!important}
.center-sub{text-align:center;font-size:17px!important}
.prio{background:var(--panel);border:2px solid var(--fam-deep);border-radius:18px;overflow:hidden}
.prio-head{display:flex;align-items:center;gap:16px;background:var(--navy);color:#fff;padding:18px 24px}
.prio-icon{display:grid;place-items:center;width:46px;height:46px;border-radius:12px;background:var(--orange);font-size:24px;flex:none}
.prio-head h3{margin:0;font-family:var(--display);font-size:clamp(20px,2.6vw,26px);font-weight:800;color:#fff}
.prio-head p{margin:2px 0 0;font-size:15px;opacity:.8}
.prio-list{list-style:none;margin:0;padding:6px 24px 10px}
.prio-list li:last-child{border-bottom:0}
.prio-list li{display:grid;grid-template-columns:280px 1fr;gap:16px;align-items:baseline;padding:13px 0;border-bottom:1px solid var(--line)}
.prio-list strong{font-family:var(--display);font-weight:700;font-size:17px}
.prio-list span{color:var(--muted);font-size:15.5px}
@media (max-width:520px){.prio-list li{grid-template-columns:1fr;gap:2px}}
.prio-list em.st{display:block;font-style:normal;font-size:14px;font-weight:600;color:var(--orange);margin-top:3px}
.prio-list em.ok-t{color:var(--ok)}
.read-note{text-align:center;font-size:14px;color:var(--muted);margin:-8px 0 14px}
/* seletor de período (seção) */
.period{display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:flex-end}
.period label{font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.select{position:relative}
.select select{appearance:none;-webkit-appearance:none;font:700 16px var(--display);color:#fff;background:var(--navy);border:0;border-radius:12px;padding:12px 48px 12px 18px;cursor:pointer;min-width:280px}
.select select:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
.select::after{content:"";position:absolute;right:18px;top:50%;width:9px;height:9px;border-right:3px solid var(--orange);border-bottom:3px solid var(--orange);transform:translateY(-70%) rotate(45deg);pointer-events:none}
.select option{color:#0E2A47;background:#fff;font-family:var(--body)}
header .title{display:flex;flex-direction:column;align-items:flex-end;gap:10px}
@media (max-width:820px){header .title{align-items:flex-start}.period{justify-content:flex-start}.select select{min-width:0;width:100%}}
/* painel multi-família */
:root{--fam-l:#BAE2F7;--fam:var(--fam-l)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--fam:color-mix(in srgb,var(--fam-l) 28%,#0D1B2C)}}
:root[data-theme="dark"]{--fam:color-mix(in srgb,var(--fam-l) 28%,#0D1B2C)}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:16px 0 6px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{font:600 14px var(--body);border-radius:10px;padding:9px 14px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--navy)}
.btn:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
.btn.primary{background:var(--orange);border-color:var(--orange);color:#fff}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 24px}
.tabs button{font:600 13.5px var(--body);padding:7px 14px;border-radius:999px;border:0;cursor:pointer;background:var(--c);color:#1d2b3a;opacity:.45}
.tabs button.geral{background:var(--navy);color:#fff}
.tabs button.has{opacity:.8}
.tabs button[aria-selected="true"]{opacity:1;box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--d)}
.tabs button:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
.tabs small{font-weight:500;opacity:.75;margin-left:4px}
.banner{background:#FFF4E5;border:1px solid var(--orange);color:#7A4A00;border-radius:12px;padding:12px 16px;margin-bottom:18px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center;font-size:14.5px}
.state{border:2px dashed var(--line);border-radius:18px;padding:36px 28px;text-align:center;color:var(--muted)}
.state h3{font-family:var(--display);color:var(--ink);font-size:21px;margin:0 0 8px}
.state ol{text-align:left;max-width:620px;margin:16px auto 0;line-height:1.7}
.hero .partial{margin:10px 0 0;font-size:14px;color:var(--muted)}
/* ranking de famílias */
.rank{display:grid;gap:14px}
.rk{display:grid;grid-template-columns:34px 230px 1fr 250px;gap:16px;align-items:center;cursor:pointer;border-radius:14px;padding:6px 8px;border:0;background:none;text-align:left;font:inherit;color:inherit;width:100%}
.rk:hover{background:var(--panel)}
.rk:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
.rk .pos{font-family:var(--display);font-weight:800;font-size:20px;color:var(--d)}
.rk .nm{font-family:var(--display);font-weight:700;font-size:15px;line-height:1.25}
.rk .bar{background:color-mix(in srgb,var(--c) 70%,var(--bg))}
.rk .bar .fill{background:var(--d)}
.rk .val{font-size:14px;color:var(--muted)}
.rk .val strong{display:block;color:var(--ink);font-size:16px}
.rk.empty{cursor:default;opacity:.55}
.rk.empty:hover{background:none}
.rk.empty .bar{background:repeating-linear-gradient(135deg,var(--panel) 0 10px,transparent 10px 20px);border:1px dashed var(--line)}
.rk.empty .bar b{color:var(--muted);text-shadow:none;font-family:var(--body);font-weight:600;font-size:14px}
details.check{margin-top:30px;border:1px solid var(--line);border-radius:14px;padding:12px 18px}
details.check summary{cursor:pointer;font-weight:700;font-size:15px}
details.check ul{margin:10px 0 4px;padding-left:20px;font-size:14px;color:var(--muted)}
details.check li.warn-i{color:#B26B00}
.hidden{display:none!important}
@media (max-width:820px){.rk{grid-template-columns:28px 1fr;row-gap:6px}.rk .bar,.rk .val{grid-column:1 / -1}}
.rk .bar,.rk .val,.rk .nm,.rk .pos{display:block}
.rk .bar .fill{display:block}
</style>
</head>

<script>
/* ================== CONFIGURAÇÃO ================== */
const CONFIG = {
  repo: 'ThaisPigatto/thaispigatto.github.io',  // dono/repositório no GitHub
  branch: 'main',
  pasta: 'dados'                                 // pasta onde ficam as planilhas
};
const FAMILIAS = [
  { id:'plasticos', nome:'Plásticos de Engenharia', cor:'#BAE2F7', forte:'#2B8AC4' },
  { id:'adesivos',  nome:'Adesivos Estruturais',    cor:'#FFC9C9', forte:'#D24C4C' },
  { id:'hub',       nome:'Pigatto Hub + Licitação', cor:'#FFF176', forte:'#A88A00' },
  { id:'papel',     nome:'Papel Térmico + Etiquetas', cor:'#F0CAED', forte:'#A0559A' },
  { id:'quimicos',  nome:'Químicos (Chemlok + Bio-Chem + Marbocote)', curto:'Químicos', cor:'#C9F2CE', forte:'#2F8F4A' }
];
/* ================================================== */

const MESES = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const CAMPOS = ['fat','nfs','ativos','novosQ','novosV','recQ','recV','perdQ','perdV'];
const $ = id => document.getElementById(id);
const esc = t => String(t ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm = t => String(t ?? '').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim();
const brl = v => 'R$ ' + Math.round(v).toLocaleString('pt-BR');
const mil = v => Math.abs(v) >= 1e6
  ? 'R$ ' + (v/1e6).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2}) + ' mi'
  : 'R$ ' + (v/1000).toLocaleString('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:1}) + ' mil';
const pct = v => (v*100).toLocaleString('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:1}) + '%';
const int = v => Math.round(v).toLocaleString('pt-BR');
const lista = a => a.length < 2 ? (a[0]||'') : a.slice(0,-1).join(', ') + ' e ' + a[a.length-1];
const stat = p => p >= .9 ? 'ok' : p >= .7 ? 'warn' : 'bad';
const sum = a => a.reduce((s,v) => s + (v||0), 0);
const curto = f => f.curto || f.nome;

/* ---------- leitura da planilha ---------- */
function num(v){
  if (v == null || v === '') return null;
  if (typeof v === 'number') return isFinite(v) ? v : null;
  let s = String(v).replace(/R\$|\s/g,'');
  if (!s || s === '—' || s === '-') return null;
  if (s.includes(',')) s = s.replace(/\./g,'').replace(',','.');
  const n = Number(s);
  return isFinite(n) ? n : null;
}
function rows(wb, nome){
  const k = wb.SheetNames.find(n => norm(n) === norm(nome));
  return k ? XLSX.utils.sheet_to_json(wb.Sheets[k], {header:1, raw:true, defval:null}) : null;
}
function familiaDe(txt){
  const t = norm(txt);
  if (!t) return null;
  if (t.startsWith('geral')) return 'geral';
  if (t.includes('plast')) return 'plasticos';
  if (t.includes('ades')) return 'adesivos';
  if (t.includes('hub') || t.includes('licita')) return 'hub';
  if (t.includes('papel') || t.includes('etiqueta')) return 'papel';
  if (t.includes('quim') || t.includes('chemlok')) return 'quimicos';
  return null;
}
function tabela(r, primeiraColuna){
  // devolve linhas abaixo do cabeçalho cuja 1ª célula é `primeiraColuna`
  if (!r) return [];
  const h = r.findIndex(l => norm(l[0]) === norm(primeiraColuna));
  if (h < 0) return [];
  return r.slice(h+1).filter(l => l.some(c => c != null && String(c).trim() !== ''));
}
function parse(wb, arquivo){
  const r = rows(wb, 'Números');
  if (!r) throw new Error('aba “Números” não encontrada');
  const info = {};
  r.slice(0, 12).forEach(l => { const k = norm(l[0]); if (['familia','ano','trimestre'].includes(k)) info[k] = l[1]; });
  const fam = familiaDe(info.familia), ano = num(info.ano), tri = num(info.trimestre);
  if (!fam) throw new Error(info.familia ? `família “${info.familia}” não reconhecida` : 'família não preenchida');
  if (!ano || !tri || tri < 1 || tri > 4) throw new Error('ano ou trimestre não preenchido');
  const h = r.findIndex(l => l.some(c => norm(c) === 'codigo'));
  if (h < 0) throw new Error('coluna “Código” não encontrada');
  const ci = r[h].findIndex(c => norm(c) === 'codigo');
  const n = {};
  r.slice(h+1).forEach(l => {
    const code = l[ci]; if (!code || typeof code !== 'string') return;
    n[code.trim()] = { m: [num(l[ci+1]), num(l[ci+2]), num(l[ci+3])], meta: num(l[ci+4]) };
  });
  const v = (c, i) => n[c] ? n[c].m[i] : null;
  const meses = [0,1,2].map(i => MESES[(tri-1)*3 + i]);
  const semHub = [0,1,2].map(i => Object.fromEntries(CAMPOS.map(c => [c, v(c,i)])));
  const hub = [0,1,2].map(i => v('hub_fat', i) == null ? null : Object.fromEntries(CAMPOS.map(c => [c, v('hub_'+c, i)])));
  const metaMes = [0,1,2].map(i => v('meta_fat', i));
  const metaInd = Object.fromEntries(['nfs','ativos','tVenda','tCliente','novosQ','novosV','recQ','recV','perdQ','perdV'].map(c => [c, n[c] ? n[c].meta : null]));

  const leitura = tabela(rows(wb,'Leitura'), 'Destaque (número)').map(l => ({ big:l[0], titulo:l[1], texto:l[2] })).filter(x => x.titulo || x.texto);
  const prio = tabela(rows(wb,'Prioritários'), 'Cliente').map(l => ({ cliente:l[0], objetivo:l[1], status:l[2], ok: norm(l[3]) === 'positivo' })).filter(x => x.cliente);
  const fr = rows(wb,'Foco');
  let focoTitulo = 'Foco para o próximo mês';
  if (fr) fr.slice(0,6).forEach(l => { if (norm(l[0]).startsWith('titulo da secao') && l[1]) focoTitulo = String(l[1]); });
  const foco = tabela(fr, 'Título').map(l => ({ titulo:l[0], texto:l[1], resp:l[2] })).filter(x => x.titulo || x.texto);
  const notas = tabela(rows(wb,'Notas'), 'Nota').map(l => l[0]).filter(Boolean);

  const avisos = [];
  if (semHub.every(m => m.fat == null)) avisos.push('faturamento não preenchido');
  if (metaMes.some(m => m == null) && semHub.some(m => m.fat != null)) avisos.push('meta de faturamento faltando em algum mês');
  semHub.forEach((m,i) => { if (m.novosQ != null && m.ativos != null && m.novosQ > m.ativos) avisos.push(`${meses[i]}: clientes novos (${m.novosQ}) maior que clientes ativos (${m.ativos})`); });
  return { arquivo, fam, ano, tri, key:`${ano}-T${tri}`, meses, semHub, hub, metaMes, metaInd,
           leitura, prio, focoTitulo, foco, notas, avisos };
}

/* ---------- carregamento ---------- */
let REMOTO = {}, LOCAL = {}, ERROS = [], FONTE = '';
const S = { periodo:null, fam:'geral', view:'sem' };

let PASTA_USADA = CONFIG.pasta;
async function listar(){
  // procura primeiro na pasta "dados"; se ela não existir, procura na raiz do repositório (arquivos no padrão nome-AAAA-T#.xlsx)
  for (const pasta of [CONFIG.pasta, '']) {
    const base = pasta ? `${pasta}/` : '';
    const padrao = pasta ? /\.xlsx$/i : /-\d{4}-T[1-4]\.xlsx$/i;
    try {
      const r = await fetch(`https://api.github.com/repos/${CONFIG.repo}/contents${pasta ? '/' + pasta : ''}?ref=${CONFIG.branch}`, {cache:'no-store'});
      if (r.ok) {
        const lista = (await r.json()).filter(f => f.type === 'file' && padrao.test(f.name) && !f.name.startsWith('~$'))
                                      .map(f => ({ nome:f.name, url:f.download_url || base + f.name }));
        if (lista.length) { FONTE = 'GitHub'; PASTA_USADA = pasta || 'raiz'; return lista; }
      }
    } catch (e) { /* tenta o índice */ }
    try {
      const r = await fetch(base + 'indice.json', {cache:'no-store'});
      if (r.ok) {
        const nomes = await r.json();
        if (nomes.length) { FONTE = 'indice.json'; PASTA_USADA = pasta || 'raiz'; return nomes.map(n => ({ nome:n, url: base + n })); }
      }
    } catch (e) { /* próxima pasta */ }
  }
  throw new Error('não foi possível listar a pasta de dados');
}
async function ler(buf, nome){ return parse(XLSX.read(buf, {type:'array'}), nome); }
function guardar(db, rec, origem){
  db[rec.key] = db[rec.key] || {};
  const ja = db[rec.key][rec.fam];
  if (ja) ERROS.push({ tipo:'warn', txt:`${origem}: ${rec.arquivo} e ${ja.arquivo} são da mesma família e trimestre. Usando ${ja.arquivo}.` });
  else db[rec.key][rec.fam] = rec;
}
async function carregar(){
  try {
    const arqs = await listar();
    const res = await Promise.all(arqs.map(async a => {
      try { const r = await fetch(a.url, {cache:'no-store'}); if (!r.ok) throw new Error('não abriu ('+r.status+')'); return await ler(await r.arrayBuffer(), a.nome); }
      catch (e) { ERROS.push({ tipo:'err', txt:`${a.nome}: ${e.message}` }); return null; }
    }));
    res.filter(Boolean).sort((a,b) => a.arquivo.localeCompare(b.arquivo)).forEach(r => guardar(REMOTO, r, 'Pasta dados'));
    $('fonte').textContent = `${res.filter(Boolean).length} planilha(s) lida(s) da pasta “${PASTA_USADA}”.`;
  } catch (e) {
    $('fonte').textContent = 'Não foi possível ler a pasta de dados: ' + e.message;
  }
  iniciar();
}

/* ---------- estado ---------- */
function DB(){
  const db = {};
  for (const src of [REMOTO, LOCAL]) for (const k in src) { db[k] = db[k] || {}; Object.assign(db[k], src[k]); }
  return db;
}
function periodos(){ return Object.keys(DB()).sort((a,b) => b.localeCompare(a)); }
function rotulo(k){ const [a,t] = k.split('-T'); return `Resultados ${t}º Trimestre - ${a}`; }
function hashSet(){ history.replaceState(null,'', `#${S.periodo || ''}/${S.fam}`); }

function iniciar(){
  const [p, f] = decodeURIComponent(location.hash.slice(1)).split('/');
  const ps = periodos();
  S.periodo = ps.includes(p) ? p : ps[0] || null;
  if (f && (f === 'geral' || FAMILIAS.some(x => x.id === f))) S.fam = f;
  render();
}

/* ---------- componentes ---------- */
function hero(real, meta, mesesComDado, total, metaFechada){
  const p = meta ? real / meta : 0;
  const parcial = mesesComDado < total;
  return `<div class="hero"><div>
    <h2>Meta do trimestre atingida</h2>
    <div class="pill" role="img" aria-label="${pct(p)} da meta"><div class="fill" style="width:${Math.min(p,1)*100}%"></div><b>${pct(p)}</b><small>meta 100%</small></div>
    ${parcial ? `<p class="partial">Parcial: ${mesesComDado} de ${total} meses com dado. Contra a meta dos meses fechados: <strong>${pct(metaFechada ? real/metaFechada : 0)}</strong>.</p>` : ''}
  </div><div class="nums">
    <div><span>Realizado</span><strong>${mil(real)}</strong></div>
    <div><span>Meta</span><strong>${meta ? mil(meta) : '—'}</strong></div>
    <div class="gap"><span>Faltou</span><strong>${meta ? (real >= meta ? 'R$ 0' : mil(meta - real)) : '—'}</strong></div>
  </div></div>`;
}
function barras(meses, fats, metas, pend){
  return `<div class="months">` + meses.map((n,i) => {
    const meta = metas[i], f = fats[i];
    if (pend && pend[i]) return `<div class="month"><div class="name">${n}</div><div class="bar pending-bar"><b>aguardando dados da Hub</b></div><div class="val"><strong>—</strong>${meta ? 'de ' + brl(meta) : ''}</div></div>`;
    if (f == null) return `<div class="month"><div class="name">${n}</div><div class="bar pending-bar"><b>sem dado</b></div><div class="val"><strong>—</strong>${meta ? 'de ' + brl(meta) : ''}</div></div>`;
    const p = meta ? f / meta : null;
    return `<div class="month"><div class="name">${n}</div>
      <div class="bar">${p != null ? `<div class="fill ${stat(p)}" style="width:${Math.min(p,1)*100}%"></div><b>${pct(p)}</b>` : `<b style="color:var(--muted);text-shadow:none">sem meta</b>`}</div>
      <div class="val"><strong>${brl(f)}</strong>${meta ? 'de ' + brl(meta) : 'sem meta'}</div></div>`;
  }).join('') + `</div>`;
}
function textos(rec){
  if (!rec) return '';
  let h = '';
  if (rec.leitura.length) h += `<section><h3 class="center-title"><span aria-hidden="true">⚠️</span> Leitura do resultado</h3>
    <p class="sub center-sub">${rec.leitura.length} ponto(s) para levar à reunião.</p>
    ${S.fam !== 'geral' && S.view === 'geral' && hasHub(rec) ? '<p class="read-note">Leitura feita com os números sem Pigatto Hub.</p>' : ''}
    <div class="reads">${rec.leitura.map(l => `<div class="read"><div class="big">${esc(l.big)}</div><h4>${esc(l.titulo)}</h4><p>${esc(l.texto)}</p></div>`).join('')}</div></section>`;
  if (rec.prio.length) h += `<section class="prio"><div class="prio-head"><span class="prio-icon" aria-hidden="true">🔄</span><div>
    <h3>Clientes prioritários para recuperação</h3><p>${rec.prio.length} cliente(s), cada um com um objetivo definido.</p></div></div>
    <ul class="prio-list">${rec.prio.map(c => `<li><strong>${esc(c.cliente)}</strong><span>${esc(c.objetivo)}${c.status ? `<em class="st${c.ok ? ' ok-t' : ''}">${esc(c.status)}</em>` : ''}</span></li>`).join('')}</ul></section>`;
  if (rec.foco.length) h += `<section><h3>${esc(rec.focoTitulo)}</h3><p class="sub">Frentes de ação, na ordem de impacto.</p>
    <div class="focus">${rec.foco.map(f => `<div><h4>${esc(f.titulo)}</h4><p>${esc(f.texto)}</p><div class="owner">Responsável: ${esc(f.resp || 'definir na reunião')}</div></div>`).join('')}</div></section>`;
  return h;
}
const hasHub = rec => rec.hub.some(Boolean);

/* ---------- visão de uma família ---------- */
function mesFam(rec, i){
  const a = rec.semHub[i];
  if (S.view === 'sem' || !hasHub(rec)) return a;
  const h = rec.hub[i];
  if (!h) return null;
  return Object.fromEntries(CAMPOS.map(c => [c, a[c] == null ? null : a[c] + (h[c] || 0)]));
}
function renderFamilia(f, rec){
  if (!rec) return `<div class="state"><h3>${esc(f.nome)}: sem planilha para ${S.periodo ? rotulo(S.periodo).replace('Resultados ','') : 'este período'}</h3>
    <p>Para aparecer aqui:</p><ol>
    <li>Clique em <strong>Baixar modelo</strong> e preencha as células amarelas (família “${esc(f.nome)}”).</li>
    <li>Clique em <strong>Conferir planilha</strong> para ver o resultado antes de publicar.</li>
    <li>No GitHub, abra a pasta <strong>${CONFIG.pasta}</strong> → Add file → Upload files → Commit changes.</li></ol></div>`;
  const temHub = hasHub(rec);
  if (!temHub) S.view = 'sem';
  const rows = [0,1,2].map(i => mesFam(rec, i));
  const pend = rows.map(r => !r);
  const faltaHub = rec.meses.filter((_,i) => pend[i]).map(n => n.toLowerCase());
  let h = '';
  if (temHub) h += `<div class="toolbar"><div class="seg" role="group" aria-label="Visão dos números">
      <button type="button" data-view="sem" aria-pressed="${S.view==='sem'}">Sem Pigatto Hub</button>
      <button type="button" data-view="geral" aria-pressed="${S.view==='geral'}">Geral (com Pigatto Hub)</button></div>
      <div class="view-note">${S.view === 'geral' ? (faltaHub.length ? `<strong>Aguardando dados da Hub:</strong> ${lista(faltaHub)}` : 'Família + Pigatto Hub') : 'Somente ' + esc(f.nome)}</div></div>`;
  const metaTri = sum(rec.metaMes);
  if (faltaHub.length) {
    h += `<div class="hero"><div><h2>Meta do trimestre atingida</h2><div class="pill pending-bar"><b>Aguardando dados da Hub de ${lista(faltaHub)}</b></div></div>
      <div class="nums"><div><span>Realizado</span><strong>—</strong></div><div><span>Meta</span><strong>${mil(metaTri)}</strong></div><div class="gap"><span>Faltou</span><strong>—</strong></div></div></div>`;
  } else {
    const com = rows.map((r,i) => r && r.fat != null ? i : -1).filter(i => i >= 0);
    h += hero(sum(com.map(i => rows[i].fat)), metaTri, com.length, 3, sum(com.map(i => rec.metaMes[i])));
  }
  h += `<section><h3>Mês a mês</h3><p class="sub">${S.view === 'geral' && temHub ? 'Visão com a Pigatto Hub somada aos números da família.' : 'Faturamento de cada mês contra a meta do mês.'}</p>
    ${barras(rec.meses, rows.map(r => r ? r.fat : null), rec.metaMes, pend)}</section>`;

  // tabela: só linhas com algum dado
  const mi = rec.metaInd;
  const L = [
    ['g','Faturamento e volume'],
    ['Faturamento', r => r.fat, brl, rec.metaMes.every(m => m === rec.metaMes[0]) ? (rec.metaMes[0] != null ? brl(rec.metaMes[0]) : '—') : rec.metaMes.map((m,i) => `${rec.meses[i].slice(0,3).toLowerCase()}: ${m != null ? brl(m) : '—'}`).join(' · ')],
    ['Notas fiscais', r => r.nfs, int, mi.nfs],
    ['Clientes ativos', r => r.ativos, int, mi.ativos],
    ['Ticket médio por venda', r => r.fat != null && r.nfs ? r.fat / r.nfs : null, brl, mi.tVenda, 'brl'],
    ['Ticket médio por cliente', r => r.fat != null && r.ativos ? r.fat / r.ativos : null, brl, mi.tCliente, 'brl'],
    ['g','Clientes novos'],
    ['Quantidade', r => r.novosQ, int, mi.novosQ],
    ['Valor faturado', r => r.novosV, brl, mi.novosV, 'brl'],
    ['Valor médio por cliente novo', r => r.novosQ ? (r.novosV ?? null) / r.novosQ : null, brl, mi.novosQ && mi.novosV ? mi.novosV / mi.novosQ : null, 'brl'],
    ['g','Clientes recuperados'],
    ['Quantidade', r => r.recQ, int, mi.recQ],
    ['Valor faturado', r => r.recV, brl, mi.recV, 'brl'],
    ['g','Orçamentos perdidos'],
    ['Quantidade', r => r.perdQ, int, mi.perdQ],
    ['Valor perdido', r => r.perdV, brl, mi.perdV, 'teto'],
  ];
  const corpo = []; let grupo = null;
  for (const l of L) {
    if (l[0] === 'g') { grupo = l[1]; continue; }
    const [lab, fn, fmt, meta, tipo] = l;
    const vals = rows.map(r => r ? fn(r) : undefined);
    if (vals.every(v => v == null) && (meta == null || typeof meta !== 'number')) continue;
    if (grupo) { corpo.push(`<tr class="group"><td colspan="5">${grupo}</td></tr>`); grupo = null; }
    const mtxt = typeof meta === 'string' ? meta : meta == null ? '—' : tipo === 'teto' ? 'até ' + brl(meta) : tipo === 'brl' ? brl(meta) : int(meta);
    corpo.push(`<tr><td>${lab}</td>${vals.map(v => v === undefined ? '<td class="pend">pendente</td>' : v == null ? '<td class="na">—</td>' : `<td>${fmt(v)}</td>`).join('')}<td>${mtxt}</td></tr>`);
  }
  h += `<section><h3>Indicadores</h3><p class="sub">Separados por tópico. Indicadores sem dado não aparecem.</p>
    <div class="tbl-wrap"><table><thead><tr><th>Indicador</th>${rec.meses.map(m => `<th>${m}</th>`).join('')}<th>Meta mensal Estipulada</th></tr></thead><tbody>${corpo.join('')}</tbody></table></div></section>`;
  h += textos(rec);
  h += `<footer>${rec.notas.map(n => `<p>${esc(n)}</p>`).join('')}<p>Tickets médios calculados: faturamento ÷ notas fiscais e faturamento ÷ clientes ativos. Arquivo: ${esc(rec.arquivo)}${rec.local ? ' (prévia local)' : ''}.</p></footer>`;
  return h;
}

/* ---------- visão geral da empresa ---------- */
function renderGeral(db){
  const g = db.geral;
  const fams = FAMILIAS.map(f => ({ f, rec: db[f.id] }));
  const com = fams.filter(x => x.rec);
  const ref = com[0]?.rec || g;
  if (!ref) return `<div class="state"><h3>Nenhuma planilha neste período</h3><p>Baixe o modelo, preencha e suba na pasta <strong>${CONFIG.pasta}</strong> do GitHub.</p></div>`;
  const meses = ref.meses;
  // faturamento por mês: soma das famílias (sem Hub dentro delas)
  const fatMes = [0,1,2].map(i => {
    if (!com.length) return g ? g.semHub[i].fat : null;
    const vs = com.map(x => x.rec.semHub[i].fat);
    return vs.every(v => v == null) ? null : sum(vs);
  });
  // famílias com planilha mas sem faturamento no mês (mês incompleto)
  const faltam = [0,1,2].map(i => com.filter(x => x.rec.semHub[i].fat == null).map(x => curto(x.f)));
  const metaFams = [0,1,2].map(i => com.length ? sum(com.filter(x => x.rec.semHub[i].fat != null || fatMes[i] == null).map(x => x.rec.metaMes[i])) : null);
  const metaMes = g && g.metaMes.some(m => m != null) ? g.metaMes : metaFams;
  const metaTri = g && g.metaMes.some(m => m != null) ? sum(g.metaMes) : sum(com.map(x => sum(x.rec.metaMes)));
  const idx = fatMes.map((v,i) => v != null ? i : -1).filter(i => i >= 0);
  const real = sum(idx.map(i => fatMes[i]));

  let h = hero(real, metaTri, idx.length, 3, sum(idx.map(i => metaMes[i])));
  // ranking
  const linhas = com.map(x => {
    const r = x.rec, ii = [0,1,2].filter(i => r.semHub[i].fat != null);
    const rv = sum(ii.map(i => r.semHub[i].fat)), mt = sum(r.metaMes);
    return { ...x, rv, mt, p: mt ? rv / mt : 0, share: real ? rv / real : 0 };
  }).sort((a,b) => b.p - a.p);
  h += `<section><h3>Famílias</h3><p class="sub">Meta do trimestre atingida por família. Clique para abrir a família.</p><div class="rank">` +
    linhas.map((x,i) => `<button type="button" class="rk" data-fam="${x.f.id}" style="--c:${x.f.cor};--d:${x.f.forte}">
      <span class="pos">${i+1}º</span><span class="nm">${esc(x.f.nome)}</span>
      <span class="bar"><span class="fill" style="width:${Math.min(x.p,1)*100}%"></span><b>${pct(x.p)}</b></span>
      <span class="val"><strong>${brl(x.rv)}</strong>de ${brl(x.mt)} · ${pct(x.share)} do total</span></button>`).join('') +
    fams.filter(x => !x.rec).map(x => `<div class="rk empty" style="--c:${x.f.cor};--d:${x.f.forte}"><span class="pos">—</span><span class="nm">${esc(x.f.nome)}</span>
      <span class="bar"><b>sem planilha neste período</b></span><span class="val">—</span></div>`).join('') + `</div></section>`;
  h += `<section><h3>Mês a mês · empresa</h3><p class="sub">Soma das famílias com planilha, contra a ${g && g.metaMes.some(m => m != null) ? 'meta da empresa' : 'soma das metas das famílias'}.</p>${barras(meses, fatMes, metaMes)}${faltam.some((f,i) => f.length && fatMes[i] != null) ? `<p class="partial" style="margin-top:10px;font-size:14px;color:var(--muted)">Mês incompleto: ${meses.map((m,i) => faltam[i].length && fatMes[i] != null ? `${m} sem ${lista(faltam[i])}` : '').filter(Boolean).join('; ')}.</p>` : ''}</section>`;
  h += textos(g);
  const notas = [];
  notas.push(`Total = soma de ${com.length} de ${FAMILIAS.length} famílias com planilha neste período.`);
  if (!(g && g.metaMes.some(m => m != null))) notas.push('Meta = soma das metas das famílias com planilha. Para usar a meta da empresa, suba uma planilha com a família “Geral (empresa)”.');
  notas.push('A Pigatto Hub entra pela planilha da família “Pigatto Hub + Licitação”. As vendas da Hub informadas dentro de outras famílias não entram no total, para não contar duas vezes.');
  if (g) notas.push(...g.notas);
  h += `<footer>${notas.map(n => `<p>${esc(n)}</p>`).join('')}</footer>`;
  // conferência geral x soma
  if (g && com.length) g.semHub.forEach((m,i) => { if (m.fat != null && fatMes[i] != null && Math.abs(m.fat - fatMes[i]) > 1)
    ERROS_P.push({ tipo:'warn', txt:`${meses[i]}: faturamento da planilha Geral (${brl(m.fat)}) difere da soma das famílias (${brl(fatMes[i])}). Diferença de ${brl(m.fat - fatMes[i])}.` }); });
  return h;
}

/* ---------- render ---------- */
let ERROS_P = [];
function render(){
  const db = DB(), ps = periodos();
  ERROS_P = [];
  $('periodo').innerHTML = ps.length ? ps.map(k => `<option value="${k}">${rotulo(k)}</option>`).join('') : '<option>Sem dados</option>';
  if (S.periodo) $('periodo').value = S.periodo;
  const pd = db[S.periodo] || {};
  const f = FAMILIAS.find(x => x.id === S.fam);
  const theme = f || FAMILIAS[0];
  document.documentElement.style.setProperty('--fam-l', f ? f.cor : '#BAE2F7');
  document.documentElement.style.setProperty('--fam-deep', f ? f.forte : '#003265');
  $('h1').textContent = f ? curto(f) === f.nome ? f.nome : f.nome : 'Grupo Pigatto · Visão geral';
  $('periodoSub').textContent = S.periodo ? (() => { const [a,t] = S.periodo.split('-T'); return `${MESES[(t-1)*3]} a ${MESES[(t-1)*3+2].toLowerCase()} de ${a}`; })() : '';
  document.title = (f ? f.nome : 'Visão geral') + ' · ' + (S.periodo ? rotulo(S.periodo) : 'Painel de Resultados');

  $('tabs').innerHTML = `<button type="button" role="tab" class="geral" data-fam="geral" style="--d:var(--orange)" aria-selected="${S.fam==='geral'}">Geral · empresa</button>` +
    FAMILIAS.map(x => `<button type="button" role="tab" data-fam="${x.id}" class="${pd[x.id] ? 'has' : ''}" style="--c:${x.cor};--d:${x.forte}" aria-selected="${S.fam===x.id}">${esc(curto(x))}${pd[x.id] ? '' : '<small>sem dados</small>'}</button>`).join('');

  const locais = Object.values(LOCAL).flatMap(o => Object.values(o));
  $('banner').innerHTML = locais.length ? `<div class="banner"><span><strong>Prévia local:</strong> ${esc(locais.map(r => r.arquivo).join(', '))}. Só você está vendo. Para publicar, suba o arquivo na pasta “${CONFIG.pasta}” do GitHub.</span><button type="button" class="btn" id="btnDescartar">Descartar prévia</button></div>` : '';

  $('main').innerHTML = S.fam === 'geral' ? renderGeral(pd) : renderFamilia(f, pd[f.id]);

  // conferência
  const av = [...ERROS, ...ERROS_P];
  Object.values(pd).forEach(r => r.avisos.forEach(a => av.push({ tipo:'warn', txt:`${r.arquivo}: ${a}` })));
  const arquivos = Object.values(pd).map(r => r.arquivo + (r.local ? ' (prévia)' : ''));
  $('checkSum').textContent = `Conferência dos dados · ${av.length ? av.length + ' aviso(s)' : 'sem avisos'}`;
  $('checkList').innerHTML = (arquivos.length ? `<li>Arquivos deste período: ${esc(arquivos.join(', '))}.</li>` : '') +
    av.map(a => `<li class="warn-i">${esc(a.txt)}</li>`).join('');
  $('check').open = av.some(a => a.tipo === 'err');
  hashSet();
}

/* ---------- eventos ---------- */
document.addEventListener('click', e => {
  const t = e.target.closest('[data-fam],[data-view],#btnDescartar');
  if (!t) return;
  if (t.id === 'btnDescartar') { LOCAL = {}; ERROS = ERROS.filter(x => !x.local); const ps = periodos(); if (!ps.includes(S.periodo)) S.periodo = ps[0] || null; render(); return; }
  if (t.dataset.fam) { S.fam = t.dataset.fam; S.view = 'sem'; render(); window.scrollTo({top:0, behavior:'smooth'}); }
  else if (t.dataset.view) { S.view = t.dataset.view; render(); }
});
$('periodo').addEventListener('change', e => { S.periodo = e.target.value; render(); });
$('btnConferir').addEventListener('click', () => $('fileInput').click());
$('fileInput').addEventListener('change', async e => {
  let ultimo = null;
  for (const file of e.target.files) {
    try { const rec = await ler(await file.arrayBuffer(), file.name); rec.local = true;
      LOCAL[rec.key] = LOCAL[rec.key] || {}; LOCAL[rec.key][rec.fam] = rec; ultimo = rec; }
    catch (err) { ERROS.push({ tipo:'err', txt:`${file.name}: ${err.message}`, local:true }); alert(`${file.name}: ${err.message}`); }
  }
  e.target.value = '';
  if (ultimo) { S.periodo = ultimo.key; S.fam = ultimo.fam; S.view = 'sem'; }
  render();
});

if (typeof XLSX === 'undefined') $('fonte').textContent = 'Não foi possível carregar o leitor de planilhas (verifique a internet).';
else carregar();
</script>
</body>
</html>
