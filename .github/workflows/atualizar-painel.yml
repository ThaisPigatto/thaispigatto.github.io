name: Atualizar Painel Comercial Pigatto
on:
  workflow_dispatch:
    inputs:
      reprocessar_mes:
        description: 'Só preencher pra CORRIGIR um mês já fechado (ex: 2026-08). Deixe em branco pra rodar normal (mês corrente).'
        required: false
        default: ''
permissions:
  contents: write
concurrency:
  group: atualizar-painel
  cancel-in-progress: false
jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 50  # 19/10/2026: mais folga para as novas tentativas quando a OMIE oscila
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Rodar atualização (extrai OMIE, recalcula, regrava index.html)
        env:
          OMIE_MATRIZ_APP_KEY: ${{ secrets.OMIE_MATRIZ_APP_KEY }}
          OMIE_MATRIZ_APP_SECRET: ${{ secrets.OMIE_MATRIZ_APP_SECRET }}
          OMIE_PAPEIS_APP_KEY: ${{ secrets.OMIE_PAPEIS_APP_KEY }}
          OMIE_PAPEIS_APP_SECRET: ${{ secrets.OMIE_PAPEIS_APP_SECRET }}
          REPROCESSAR_MES: ${{ github.event.inputs.reprocessar_mes }}
        # tee: guarda a saída num arquivo pro aviso por e-mail abaixo; pipefail mantém o erro do script
        run: |
          set -o pipefail
          python automacao/atualizar_painel.py 2>&1 | tee saida_robo.log
      - name: Gerar PDF de resultados dos meses fechados
        # Pedido da Thais, 13/10/2026. Só regera o PDF de um mês FECHADO quando os dados dele
        # mudaram (virada, refazer fechamento, reprocessar_mes) — compara com pdf/<mês>.carimbo.
        # Se esta etapa falhar, o painel continua sendo publicado normalmente (continue-on-error).
        id: pdf
        continue-on-error: true
        run: |
          pip install --quiet reportlab==4.4.10
          python automacao/gerar_pdf_resultados.py
      - name: Publicar (commit + push) só se algo mudou
        run: |
          git config user.name "Painel Pigatto (robô)"
          git config user.email "actions@github.com"
          git add index.html meses.json automacao/produto_familia_cache.json
          git add -- *.html
          git add -A pdf 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Nada mudou desde a última atualização."
          else
                        git commit -m "Atualização automática do painel — $(date -u '+%Y-%m-%d %H:%M UTC')"
            for i in 1 2 3 4 5; do
              if git push; then
                echo "Publicado com sucesso."
                break
              fi
              echo "Push rejeitado — tentativa $i, atualizando e tentando de novo..."
              git pull --rebase origin main
              if [ "$i" -eq 5 ]; then
                echo "Falhou após 5 tentativas."
                exit 1
              fi
              sleep 5
            done
          fi
      - name: Avisar por e-mail que o painel NÃO foi atualizado
        # Só roda quando alguma etapa anterior falhou (ex.: trava de soma por família fora dos
        # grupos, erro da OMIE). Pedido da Thais, 30/09/2026. Não publica nada, só avisa.
        if: failure()
        env:
          SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
          LINK_EXECUCAO: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          NUM_EXECUCAO: ${{ github.run_number }}
        run: |
          python - <<'PY'
          import os, smtplib, datetime
          from email.mime.text import MIMEText
          from zoneinfo import ZoneInfo
          DEST = ["thais.brito@pigattodistribuidora.com.br"]
          USER = "thais.brito@pigattodistribuidora.com.br"
          try:
              linhas = open("saida_robo.log", encoding="utf-8", errors="replace").read().splitlines()
          except FileNotFoundError:
              linhas = ["(o script nem chegou a rodar — veja o link abaixo)"]
          log = "\n".join(linhas[-40:])
          trava = any("VALIDAÇÃO FALHOU" in l for l in linhas)
          fora = [l.strip() for l in linhas if "família fora dos grupos" in l]
          agora = datetime.datetime.now(ZoneInfo("America/Sao_Paulo")).strftime("%d/%m/%Y %H:%M")
          if trava:
              assunto = "⚠️ Painel NÃO atualizado — venda em família fora dos grupos"
              motivo = ("A trava de segurança bloqueou a publicação: a soma por vendedor não bateu "
                        "com o total geral.\n\n" + ("\n".join(fora) if fora else "(família não identificada no log)"))
          else:
              assunto = "⚠️ Painel NÃO atualizado — erro na atualização"
              motivo = "A atualização falhou antes de publicar (ex.: erro ou lentidão da OMIE)."
          corpo = (f"Execução #{os.environ['NUM_EXECUCAO']} — {agora} (horário de Brasília)\n\n{motivo}\n\n"
                   "O painel continua no ar com os números da última atualização que deu certo.\n\n"
                   f"Detalhes: {os.environ['LINK_EXECUCAO']}\n\n--- últimas linhas do log ---\n{log}\n")
          msg = MIMEText(corpo, "plain", "utf-8")
          msg["Subject"], msg["From"], msg["To"] = assunto, USER, ", ".join(DEST)
          # 19/10/2026: tenta 587 (STARTTLS) e, se o Gmail fechar a conexão, 465 (SSL).
          senha = os.environ.get("SMTP_APP_PASSWORD", "").replace(" ", "")
          if not senha:
              raise SystemExit("Secret SMTP_APP_PASSWORD vazio — cadastre a senha de app do Gmail nos Secrets.")
          erros = []
          for modo in ("starttls", "ssl"):
              try:
                  if modo == "starttls":
                      s = smtplib.SMTP("smtp.gmail.com", 587, timeout=30); s.starttls()
                  else:
                      s = smtplib.SMTP_SSL("smtp.gmail.com", 465, timeout=30)
                  with s:
                      s.login(USER, senha); s.sendmail(USER, DEST, msg.as_string())
                  print("Aviso enviado para", DEST, "via", modo); break
              except Exception as e:
                  erros.append(f"{modo}: {type(e).__name__}: {e}")
          else:
              raise SystemExit("Gmail recusou o login nas duas formas — a senha de app (SMTP_APP_PASSWORD) "
                               "provavelmente foi revogada. Gere uma nova e atualize o Secret. Detalhe: " + " | ".join(erros))
          PY
