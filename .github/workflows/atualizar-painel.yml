name: Atualizar Painel Comercial Pigatto
on:
  schedule:
    # Minutos "quebrados" de propósito: o GitHub atrasa/descarta execuções agendadas
    # em horário cheio (:00, :15, :30, :45) por excesso de fila. Ajuste de 29/09/2026.
    - cron: '43 10 * * *'  # 07:43 SP
    - cron: '17 11 * * *'  # 08:17 SP
    - cron: '7 12 * * *'   # 09:07 SP
    - cron: '7 13 * * *'   # 10:07 SP
    - cron: '7 14 * * *'   # 11:07 SP
    - cron: '7 17 * * *'   # 14:07 SP
    - cron: '7 18 * * *'   # 15:07 SP
    - cron: '7 19 * * *'   # 16:07 SP
    - cron: '37 19 * * *'  # 16:37 SP
    - cron: '7 20 * * *'   # 17:07 SP
    - cron: '37 20 * * *'  # 17:37 SP
    - cron: '7 21 * * *'   # 18:07 SP
    - cron: '59 2 * * *'   # 23:59 SP (do dia anterior em UTC, roda todo dia)
  workflow_dispatch:
    inputs:
      reprocessar_mes:
        description: 'Só preencher pra CORRIGIR um mês já fechado (ex: 2026-08). Deixe em branco pra rodar normal (mês corrente).'
        required: false
        default: ''
permissions:
  contents: write
concurrency:
  group: atualizar-painel
  cancel-in-progress: false
jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Rodar atualização (extrai OMIE, recalcula, regrava index.html)
        env:
          OMIE_MATRIZ_APP_KEY: ${{ secrets.OMIE_MATRIZ_APP_KEY }}
          OMIE_MATRIZ_APP_SECRET: ${{ secrets.OMIE_MATRIZ_APP_SECRET }}
          OMIE_PAPEIS_APP_KEY: ${{ secrets.OMIE_PAPEIS_APP_KEY }}
          OMIE_PAPEIS_APP_SECRET: ${{ secrets.OMIE_PAPEIS_APP_SECRET }}
          REPROCESSAR_MES: ${{ github.event.inputs.reprocessar_mes }}
        run: python automacao/atualizar_painel.py
      - name: Publicar (commit + push) só se algo mudou
        run: |
          git config user.name "Painel Pigatto (robô)"
          git config user.email "actions@github.com"
          git add index.html meses.json automacao/produto_familia_cache.json
          git add -- *.html
          if git diff --cached --quiet; then
            echo "Nada mudou desde a última atualização."
          else
                        git commit -m "Atualização automática do painel — $(date -u '+%Y-%m-%d %H:%M UTC')"
            for i in 1 2 3 4 5; do
              if git push; then
                echo "Publicado com sucesso."
                break
              fi
              echo "Push rejeitado — tentativa $i, atualizando e tentando de novo..."
              git pull --rebase origin main
              if [ "$i" -eq 5 ]; then
                echo "Falhou após 5 tentativas."
                exit 1
              fi
              sleep 5
            done
          fi
