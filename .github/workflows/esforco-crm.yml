name: Atualizar Esforço Comercial (CRM)
# Horários desejados (Brasília): 06h, 10h, 14h e 17h, todos os dias.
# O agendamento do GitHub (schedule) costuma atrasar horas ou pular horários. Por isso há 3 gatilhos:
#   1) logo depois de cada execução do robô de faturamento (que roda toda hora, de forma confiável);
#   2) o agendamento do GitHub, como reserva;
#   3) manual: aba Actions > Atualizar Esforço Comercial (CRM) > Run workflow.
# Em todos os casos o robô só atualiza se já passou um horário (06/10/14/17h) desde a última atualização;
# se não for a hora, a execução termina sozinha em segundos, sem mexer em nada.
on:
  workflow_run:
    workflows: ["Atualizar Painel Comercial Pigatto"]
    types: [completed]
  schedule:
    - cron: '12 9,13,17,20 * * *'   # 06:12, 10:12, 14:12, 17:12 (Brasília) - reserva
    - cron: '42 9,13,17,20 * * *'   # 06:42, 10:42, 14:42, 17:42 (Brasília) - reserva
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: esforco-crm
  cancel-in-progress: false
jobs:
  atualizar:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v5
      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Está na hora de atualizar? (06h, 10h, 14h e 17h de Brasília)
        id: hora
        env:
          EVENTO: ${{ github.event_name }}
        run: |
          python - <<'PY'
          import os, re, datetime
          from zoneinfo import ZoneInfo
          SP = ZoneInfo("America/Sao_Paulo")
          HORARIOS = [6, 10, 14, 17]
          agora = datetime.datetime.now(SP)
          # último horário-alvo que já passou (hoje ou ontem)
          alvos = [agora.replace(hour=h, minute=0, second=0, microsecond=0) - datetime.timedelta(days=d)
                   for d in (0, 1) for h in HORARIOS]
          ultimo_alvo = max(a for a in alvos if a <= agora)
          rodar = True
          if os.environ.get("EVENTO") != "workflow_dispatch":
              try:
                  txt = open("esforco_data.js", encoding="utf-8").read(3000)
                  ger = datetime.datetime.fromisoformat(re.search(r'"geradoEm":"([^"]+)"', txt).group(1))
                  if ger.tzinfo is None:
                      ger = ger.replace(tzinfo=datetime.timezone.utc)
                  rodar = ger < ultimo_alvo
                  print(f"Última atualização: {ger.astimezone(SP):%d/%m %H:%M} · horário-alvo mais recente: {ultimo_alvo:%d/%m %H:%M}")
              except Exception as e:
                  print("Não consegui ler a data da última atualização, vou atualizar:", e)
          print("-> ATUALIZA AGORA" if rodar else "-> já está em dia, nada a fazer")
          open(os.environ["GITHUB_OUTPUT"], "a").write("rodar=%s\n" % ("true" if rodar else "false"))
          PY
      - name: Rodar robô (lê CRM do Omie, regrava esforco_data.js) com até 3 tentativas
        if: steps.hora.outputs.rodar == 'true'
        env:
          OMIE_MATRIZ_APP_KEY: ${{ secrets.OMIE_MATRIZ_APP_KEY }}
          OMIE_MATRIZ_APP_SECRET: ${{ secrets.OMIE_MATRIZ_APP_SECRET }}
          OMIE_PAPEIS_APP_KEY: ${{ secrets.OMIE_PAPEIS_APP_KEY }}
          OMIE_PAPEIS_APP_SECRET: ${{ secrets.OMIE_PAPEIS_APP_SECRET }}
        run: |
          set -o pipefail
          for i in 1 2 3; do
            if python automacao/esforco_crm.py 2>&1 | tee saida_esforco.log; then
              echo "Robô concluído na tentativa $i."
              exit 0
            fi
            echo "Tentativa $i falhou (Omie ocupado ou instável)."
            if [ "$i" -lt 3 ]; then echo "Esperando 2 minutos para tentar de novo..."; sleep 120; fi
          done
          exit 1
      - name: Publicar (commit + push) só se algo mudou
        if: steps.hora.outputs.rodar == 'true'
        run: |
          git config user.name "Painel Pigatto (robô)"
          git config user.email "actions@github.com"
          git add esforco_data.js
          if git diff --cached --quiet; then
            echo "Nada mudou desde a última atualização."
          else
            git commit -m "Atualização automática do esforço comercial — $(date -u '+%Y-%m-%d %H:%M UTC')"
            for i in 1 2 3 4 5; do
              if git push; then
                echo "Publicado com sucesso."
                break
              fi
              echo "Push rejeitado — tentativa $i, atualizando e tentando de novo..."
              git pull --rebase origin main
              if [ "$i" -eq 5 ]; then
                echo "Falhou após 5 tentativas."
                exit 1
              fi
              sleep 5
            done
          fi
      - name: Avisar por e-mail que o painel de esforço NÃO foi atualizado
        # mesmo aviso do painel de faturamento; só roda se alguma etapa acima falhou
        if: failure()
        env:
          SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
          LINK_EXECUCAO: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          NUM_EXECUCAO: ${{ github.run_number }}
        run: |
          python - <<'PY'
          import os, smtplib, datetime
          from email.mime.text import MIMEText
          from zoneinfo import ZoneInfo
          DEST = ["thais.brito@pigattodistribuidora.com.br"]
          USER = "thais.brito@pigattodistribuidora.com.br"
          try:
              linhas = open("saida_esforco.log", encoding="utf-8", errors="replace").read().splitlines()
          except FileNotFoundError:
              linhas = ["(o script nem chegou a rodar — veja o link abaixo)"]
          log = "\n".join(linhas[-40:])
          agora = datetime.datetime.now(ZoneInfo("America/Sao_Paulo")).strftime("%d/%m/%Y %H:%M")
          corpo = (f"Execução #{os.environ['NUM_EXECUCAO']} — {agora} (horário de Brasília)\n\n"
                   "O painel de Esforço Comercial NÃO foi atualizado (erro do Omie ou nos dados).\n"
                   "Ele continua no ar com os números da última atualização que deu certo.\n\n"
                   f"Detalhes: {os.environ['LINK_EXECUCAO']}\n\n--- últimas linhas do log ---\n{log}\n")
          msg = MIMEText(corpo, "plain", "utf-8")
          msg["Subject"], msg["From"], msg["To"] = "⚠️ Esforço Comercial NÃO atualizado — erro na atualização", USER, ", ".join(DEST)
          with smtplib.SMTP("smtp.gmail.com", 587) as s:
              s.starttls(); s.login(USER, os.environ["SMTP_APP_PASSWORD"]); s.sendmail(USER, DEST, msg.as_string())
          print("Aviso enviado para", DEST)
          PY
