<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ESPREMENDO AS LARANJAS — Grupo Pigatto</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1B1B18;
    --ink-dim:#726F66;
    --line:#E7E3DA;
    --paper:#FFFFFF;
    --panel:#FBF9F5;
    --orange:#E8631C;
    --orange-deep:#B84B14;
    --talvez:#D6A419;
    --talvez-bg:#FBF1DA;
    --certeza:#1E7A4C;
    --certeza-bg:#E3F1E8;
    --todos-bg:#F3EFE6;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Space Grotesk', system-ui, sans-serif;
  }
  .wrap{ max-width:1760px; margin:0 auto; padding:30px 28px 56px; }
  .page{ display:grid; grid-template-columns: 1fr 1fr; gap:48px; align-items:start; }
  @media (max-width:1100px){ .page{ grid-template-columns:1fr; } }

  header{ position:relative; display:flex; justify-content:center; align-items:center; padding-bottom:24px; border-bottom:1px solid var(--line); margin-bottom:34px; }
  header img.logo{ position:absolute; left:0; top:50%; transform:translateY(-50%); height:52px; width:auto; display:block; }

  .masthead{ text-align:center; }
  .title-row{ display:inline-flex; align-items:center; gap:18px; margin-bottom:10px; }
  .title-row svg{ width:40px; height:40px; flex-shrink:0; }
  .masthead .goal{ margin-bottom:0; }
  h1{
    font-weight:700;
    font-size: clamp(28px, 3.4vw, 42px);
    margin:0;
    letter-spacing:-0.01em;
    line-height:1.05;
  }
  h1 i{ font-style:italic; color:var(--orange); font-weight:600; }
  .period{ font-size:14px; font-weight:700; letter-spacing:0.14em; color:var(--ink-dim); margin-top:2px; }

  .funnel{ display:grid; grid-template-columns:repeat(3,1fr); gap:20px; margin-bottom:38px; }
  .fcard{ background:var(--panel); border:1px solid var(--line); border-radius:14px; overflow:hidden; }
  .fcard-top{ height:4px; }
  .fcard-top.talvez{ background:var(--talvez); }
  .fcard-top.certeza{ background:var(--certeza); }
  .fcard-top.todos{ background:var(--line); }
  .fcard-top.objetivo{ background:var(--orange); }
  .fcard-head{ display:flex; align-items:center; justify-content:space-between; padding:14px 18px 10px; }
  .fcard-label{ font-size:12px; font-weight:700; letter-spacing:0.08em; }
  .fcard-label.talvez{ color:var(--talvez); }
  .fcard-label.certeza{ color:var(--certeza); }
  .fcard-label.todos{ color:var(--ink); }
  .fcard-label.objetivo{ color:var(--orange-deep); }
  .objetivo-periodo{ padding:2px 18px 16px; font-size:12px; color:var(--ink-dim); }
  .fcard-total{ font-weight:700; font-size:19px; white-space:nowrap; }
  .fcard-head{ flex-wrap:wrap; }
  .fcard ul{ list-style:none; margin:0; padding:0 18px 16px; }
  .fcard li{ display:flex; justify-content:space-between; gap:10px; font-size:13.5px; padding:7px 0; border-top:1px solid var(--line); }
  .fcard li:first-child{ border-top:none; }
  .fcard .name{ color:var(--ink-dim); }
  .fcard li{ align-items:center; }
  .fcard li .left{ display:flex; align-items:center; gap:8px; min-width:0; flex:1 1 auto; }
  .fcard .name{ word-break:break-word; }
  .fcard .val{ display:flex; flex-direction:column; align-items:flex-end; gap:1px; flex-shrink:0; }
  .fcard .price{ font-weight:600; font-size:13.5px; white-space:nowrap; }
  .fcard .date{ font-size:11px; color:var(--ink-dim); font-weight:500; white-space:nowrap; }
  .chk{
    width:16px; height:16px; border:2px solid var(--line); border-radius:4px;
    display:inline-flex; align-items:center; justify-content:center; cursor:pointer;
    flex-shrink:0; background:#fff;
  }
  .chk.done{ background:var(--orange); border-color:var(--orange); }
  .chk.done::after{ content:"✓"; color:#fff; font-size:11px; font-weight:700; line-height:1; }
  .fcard li.done .name, .fcard li.done .val{ color:var(--ink-dim); text-decoration:line-through; text-decoration-color:var(--line); }

  .goal{ margin-bottom:34px; font-size:15px; color:var(--ink); }
  .goal .num{ font-weight:700; color:var(--orange-deep); }
  .goal .lbl{ color:var(--ink-dim); }

  h2{ font-size:19px; font-weight:600; margin:0 0 14px; }

  .acoes{ border-collapse:separate; border-spacing:0; width:100%; margin-bottom:36px; }
  .acoes th{
    font-size:12.5px; font-weight:700; letter-spacing:0.04em; text-align:left;
    padding:10px 14px; color:#fff;
  }
  .acoes th:first-child{ background:transparent; }
  .acoes th.adesivos{ background:#A5271C; border-radius:8px 8px 0 0; }
  .acoes th.especialidades{ background:#2E7D4F; border-radius:8px 8px 0 0; }
  .acoes th.hub{ background:#C99A1B; color:#1B1B18; border-radius:8px 8px 0 0; }
  .acoes th.plasticos{ background:#2E86AB; border-radius:8px 8px 0 0; }
  .acoes th.papeis{ background:#8E5AA6; border-radius:8px 8px 0 0; }
  .acoes td{ padding:10px 14px; font-size:13.5px; border-bottom:1px solid var(--line); vertical-align:top; }
  .acoes td:first-child{ color:var(--ink-dim); font-weight:600; width:24px; }
  .acoes tr:nth-child(odd) td{ background:var(--panel); }

  .revisar{ margin-top:26px; }
  .revisar b{ display:block; font-size:14.5px; margin:0 0 6px; }
  .revisar p{ margin:0 0 4px; font-size:13.5px; color:var(--ink-dim); }
  .revisar .grupo{ margin-bottom:18px; }

  .vq{ border-collapse:separate; border-spacing:0 8px; width:100%; max-width:400px; }
  .vq th{ text-align:left; font-size:12px; letter-spacing:0.06em; color:var(--ink-dim); font-weight:600; padding:0 14px 4px; }
  .vq td{ padding:10px 14px; font-weight:600; font-size:14px; }
  .vq td.vq-chk{ padding-right:0; width:20px; }
  .vq tr.done td:nth-child(2){ text-decoration:line-through; color:var(--ink-dim); }
  .vq tr.row td:first-child{ border-radius:8px 0 0 8px; background:var(--panel); }
  .vq tr.row td:last-child{ border-radius:0 8px 8px 0; color:#fff; }
  .vq td.adesivos{ background:#A5271C; }
  .vq td.especialidades{ background:#2E7D4F; }
  .vq td.hub{ background:#C99A1B; color:#1B1B18 !important; }
  .vq td.plasticos{ background:#2E86AB; }
  .vq td.papeis{ background:#8E5AA6; }

  footer{ margin-top:36px; padding-top:12px; border-top:1px solid var(--line); font-size:11.5px; color:var(--ink-dim); }

  @media (max-width:900px){
    .funnel{ grid-template-columns:1fr; }
    header{ flex-direction:column; gap:16px; }
    header img.logo{ position:static; transform:none; }
  }
</style>
</head>
<body>

  <div class="masthead">
  <div class="title-row">
    <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <circle cx="50" cy="50" r="46" fill="#E8631C"/>
      <g stroke="#FFDDA8" stroke-width="2" opacity="0.9">
        <line x1="50" y1="50" x2="50" y2="8"/>
        <line x1="50" y1="50" x2="82.6" y2="27.4"/>
        <line x1="50" y1="50" x2="88.9" y2="65.4"/>
        <line x1="50" y1="50" x2="68.1" y2="88.6"/>
        <line x1="50" y1="50" x2="31.9" y2="88.6"/>
        <line x1="50" y1="50" x2="11.1" y2="65.4"/>
        <line x1="50" y1="50" x2="17.4" y2="27.4"/>
      </g>
      <circle cx="50" cy="50" r="8" fill="#FFDDA8"/>
    </svg>
    <h1><i>ESPREMENDO AS LARANJAS</i></h1>
  </div>

  <div class="period">SETEMBRO 2026</div>

  <p class="goal">Objetivo: <span class="num" id="goalNum">—</span> <span class="lbl">(<span id="periodoAte"></span>)</span></p>

  </div>

  </header>

  <div class="page">
  <div class="col-left">

  <div class="funnel">
    <div class="fcard">
      <div class="fcard-top talvez"></div>
      <div class="fcard-head"><span class="fcard-label talvez">TALVEZ</span><span class="fcard-total" id="talvezTotal">—</span></div>
      <ul id="talvezItems"></ul>
    </div>
    <div class="fcard">
      <div class="fcard-top certeza"></div>
      <div class="fcard-head"><span class="fcard-label certeza">CERTEZA</span><span class="fcard-total" id="certezaTotal">—</span></div>
      <ul id="certezaItems"></ul>
    </div>
    <div class="fcard">
      <div class="fcard-top objetivo"></div>
      <div class="fcard-head"><span class="fcard-label objetivo">OBJETIVO</span><span class="fcard-total" id="objetivoTotal">—</span></div>
      <ul>
        <li><span class="left"><span class="name">Na mira</span></span><span class="val"><span class="price" id="naMiraVal">—</span></span></li>
        <li><span class="left"><span class="name">Realizado</span></span><span class="val"><span class="price" id="realizadoVal">—</span></span></li>
      </ul>
      <div class="objetivo-periodo" id="objetivoPeriodo"></div>
    </div>
  </div>

  </div>

  <div class="col-right">

  <h2>Ações por área</h2>
  <table class="acoes">
    <tr>
      <th></th>
      <th class="adesivos">Adesivos</th>
      <th class="especialidades">Especialidades</th>
      <th class="hub">HUB</th>
      <th class="plasticos">Plasticos de Eng</th>
      <th class="papeis">Papeis</th>
    </tr>
    <tbody id="acoesBody"></tbody>
  </table>

  <table class="vq">
    <tr><th></th><th>Valor</th><th>QUEM VAI ESPREMER</th></tr>
    <tbody id="valorQuemBody"></tbody>
  </table>
  </div>

  </div>

  <footer><span id="updated"></span></footer>

</div>

<script>
  const DATA_URL = 'espremendo-laranja-data.json';
  const REFRESH_MS = 60000;

  function fmtBRL(v){
    return 'R$ ' + Number(v).toLocaleString('pt-BR', {minimumFractionDigits:2, maximumFractionDigits:2});
  }

  function checkKey(section, idx, nome){
    return 'espremendo-check:' + section + ':' + idx + ':' + nome;
  }

  function isDone(section, idx, nome){
    try{ return localStorage.getItem(checkKey(section, idx, nome)) === '1'; }
    catch(e){ return false; }
  }

  function toggleDone(section, idx, nome, li, box){
    const key = checkKey(section, idx, nome);
    const nowDone = !isDone(section, idx, nome);
    try{ localStorage.setItem(key, nowDone ? '1' : '0'); } catch(e){}
    li.classList.toggle('done', nowDone);
    box.classList.toggle('done', nowDone);
    if(section === 'certeza' || section === 'talvez') refreshRealizado();
  }

  function computeRealizado(){
    if(!lastGood) return 0;
    let sum = 0;
    ['talvez', 'certeza'].forEach(function(section){
      if(!lastGood[section]) return;
      lastGood[section].itens.forEach(function(i, idx){
        if(isDone(section, idx, i.nome || '')) sum += i.valor;
      });
    });
    return sum;
  }

  function refreshRealizado(){
    const el = document.getElementById('realizadoVal');
    if(el) el.textContent = fmtBRL(computeRealizado());
  }

  function itemLi(section, idx, i, showName){
    const done = isDone(section, idx, i.nome || '');
    const li = document.createElement('li');
    if(done) li.classList.add('done');
    const nameHtml = showName ? '<span class="name">'+(i.nome||'')+'</span>' : '<span></span>';
    const dateHtml = i.data ? '<span class="date">'+i.data+'</span>' : '';
    li.innerHTML = '<span class="left"><span class="chk-slot"></span>' + nameHtml + '</span>' +
      '<span class="val"><span class="price">' + fmtBRL(i.valor) + '</span>' + dateHtml + '</span>';
    const box = document.createElement('span');
    box.className = 'chk' + (done ? ' done' : '');
    box.addEventListener('click', function(){ toggleDone(section, idx, i.nome || '', li, box); });
    li.querySelector('.chk-slot').replaceWith(box);
    return li;
  }

  function fillList(elId, section, itens, showName){
    const ul = document.getElementById(elId);
    ul.innerHTML = '';
    itens.forEach(function(i, idx){ ul.appendChild(itemLi(section, idx, i, showName)); });
  }

  function render(data){
    lastGood = data;
    document.getElementById('talvezTotal').textContent = fmtBRL(data.talvez.total);
    fillList('talvezItems', 'talvez', data.talvez.itens, true);

    document.getElementById('certezaTotal').textContent = fmtBRL(data.certeza.total);
    fillList('certezaItems', 'certeza', data.certeza.itens, true);

    document.getElementById('objetivoTotal').textContent = fmtBRL(data.objetivo_periodo.objetivo);
    document.getElementById('naMiraVal').textContent = fmtBRL(data.objetivo_periodo.na_mira);
    document.getElementById('realizadoVal').textContent = fmtBRL(computeRealizado());
    document.getElementById('objetivoPeriodo').textContent = data.objetivo_periodo.periodo;

    document.getElementById('goalNum').textContent = fmtBRL(data.objetivo_periodo.objetivo);
    document.getElementById('periodoAte').textContent = data.objetivo_periodo.periodo.replace(' - ', ' até ');

    document.getElementById('acoesBody').innerHTML = [1,2,3].map(function(n){
      return '<tr><td>'+n+'</td>' + data.acoes_por_area.map(function(a){
        return '<td>'+(a.itens[n-1]||'')+'</td>';
      }).join('') + '</tr>';
    }).join('');

    const vqBody = document.getElementById('valorQuemBody');
    vqBody.innerHTML = '';
    data.distribuicao_por_area.forEach(function(d, idx){
      const done = isDone('area', idx, d.area);
      const tr = document.createElement('tr');
      tr.className = 'row' + (done ? ' done' : '');
      tr.innerHTML = '<td class="vq-chk"></td><td>'+fmtBRL(d.valor)+'</td><td class="'+d.classe+'">'+d.area+'</td>';
      const box = document.createElement('span');
      box.className = 'chk' + (done ? ' done' : '');
      box.addEventListener('click', function(){
        const nowDone = !isDone('area', idx, d.area);
        try{ localStorage.setItem(checkKey('area', idx, d.area), nowDone ? '1' : '0'); } catch(e){}
        tr.classList.toggle('done', nowDone);
        box.classList.toggle('done', nowDone);
      });
      tr.querySelector('.vq-chk').appendChild(box);
      vqBody.appendChild(tr);
    });

    const dt = new Date(data.atualizado_em);
    document.getElementById('updated').textContent = 'Atualizado ' + dt.toLocaleString('pt-BR');
  }

  let lastGood = null;
  async function load(){
    try{
      const res = await fetch(DATA_URL + '?_=' + Date.now(), {cache:'no-store'});
      if(!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();
      lastGood = data;
      render(data);
    } catch(e){
      if(lastGood) render(lastGood);
    }
  }

  load();
  setInterval(load, REFRESH_MS);
</script>
</body>
</html>
