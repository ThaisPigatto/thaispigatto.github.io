<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OPERAÇÃO ESPREMENDO A LARANJA — Grupo Pigatto</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,600;0,700;1,600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1B1B18;
    --ink-dim:#726F66;
    --line:#E7E3DA;
    --paper:#FFFFFF;
    --panel:#FBF9F5;
    --orange:#E8631C;
    --orange-deep:#B84B14;
    --talvez:#C9971A;
    --talvez-bg:#FBF1DA;
    --certeza:#1E7A4C;
    --certeza-bg:#E3F1E8;
    --todos-bg:#F3EFE6;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Space Grotesk', system-ui, sans-serif;
  }
  .wrap{ max-width:1180px; margin:0 auto; padding:30px 28px 56px; }

  header{ display:flex; align-items:baseline; justify-content:space-between; padding-bottom:14px; border-bottom:1px solid var(--line); margin-bottom:34px; }
  .brand{ font-weight:600; font-size:13px; letter-spacing:0.06em; }
  .brand em{ font-style:normal; color:var(--ink-dim); font-weight:500; }
  .status{ font-size:12px; color:var(--ink-dim); font-variant-numeric:tabular-nums; }

  .title-row{ display:flex; align-items:center; gap:18px; margin-bottom:8px; }
  .title-row svg{ width:44px; height:44px; flex-shrink:0; }
  h1{
    font-family:'Fraunces', serif;
    font-weight:700;
    font-size: clamp(28px, 3.4vw, 42px);
    margin:0;
    letter-spacing:-0.01em;
    line-height:1.05;
  }
  h1 i{ font-style:italic; color:var(--orange); font-weight:600; }
  .kicker{ font-size:13px; color:var(--ink-dim); margin:0 0 34px 62px; }

  .funnel{ display:grid; grid-template-columns:repeat(3,1fr); gap:20px; margin-bottom:38px; }
  .fcard{ background:var(--panel); border:1px solid var(--line); border-radius:14px; overflow:hidden; }
  .fcard-top{ height:4px; }
  .fcard-top.talvez{ background:var(--talvez); }
  .fcard-top.certeza{ background:var(--certeza); }
  .fcard-top.todos{ background:var(--orange); }
  .fcard-head{ display:flex; align-items:center; justify-content:space-between; padding:14px 18px 10px; }
  .fcard-label{ font-size:12px; font-weight:700; letter-spacing:0.08em; }
  .fcard-label.talvez{ color:var(--talvez); }
  .fcard-label.certeza{ color:var(--certeza); }
  .fcard-label.todos{ color:var(--orange-deep); }
  .fcard-total{ font-family:'Fraunces', serif; font-weight:700; font-size:19px; }
  .fcard ul{ list-style:none; margin:0; padding:0 18px 16px; }
  .fcard li{ display:flex; justify-content:space-between; gap:10px; font-size:13.5px; padding:7px 0; border-top:1px solid var(--line); }
  .fcard li:first-child{ border-top:none; }
  .fcard .name{ color:var(--ink-dim); }
  .fcard .val{ font-weight:600; white-space:nowrap; }

  .goal{
    display:flex; align-items:baseline; gap:12px;
    background:linear-gradient(100deg, var(--orange), var(--orange-deep));
    color:#fff; border-radius:14px; padding:16px 22px; margin-bottom:34px;
  }
  .goal .num{ font-family:'Fraunces', serif; font-weight:700; font-size:24px; }
  .goal .lbl{ font-size:13px; letter-spacing:0.05em; font-weight:600; opacity:0.92; }

  h2{ font-family:'Fraunces', serif; font-size:19px; font-weight:600; margin:0 0 14px; }

  .acoes{ border-collapse:separate; border-spacing:0; width:100%; margin-bottom:36px; }
  .acoes th{
    font-size:12.5px; font-weight:700; letter-spacing:0.04em; text-align:left;
    padding:10px 14px; color:#fff;
  }
  .acoes th:first-child{ background:transparent; }
  .acoes th.adesivos{ background:#A5271C; border-radius:8px 8px 0 0; }
  .acoes th.especialidades{ background:#2E7D4F; border-radius:8px 8px 0 0; }
  .acoes th.hub{ background:#C99A1B; color:#1B1B18; border-radius:8px 8px 0 0; }
  .acoes th.plasticos{ background:#2E86AB; border-radius:8px 8px 0 0; }
  .acoes th.papeis{ background:#8E5AA6; border-radius:8px 8px 0 0; }
  .acoes td{ padding:10px 14px; font-size:13.5px; border-bottom:1px solid var(--line); vertical-align:top; }
  .acoes td:first-child{ color:var(--ink-dim); font-weight:600; width:24px; }
  .acoes tr:nth-child(odd) td{ background:var(--panel); }

  .lower{ display:grid; grid-template-columns: 1.1fr 1fr; gap:40px; align-items:start; }
  .revisar b{ display:block; font-size:14.5px; margin:0 0 6px; }
  .revisar p{ margin:0 0 4px; font-size:13.5px; color:var(--ink-dim); }
  .revisar .grupo{ margin-bottom:18px; }

  .vq{ border-collapse:separate; border-spacing:0 8px; width:100%; max-width:400px; }
  .vq th{ text-align:left; font-size:12px; letter-spacing:0.06em; color:var(--ink-dim); font-weight:600; padding:0 14px 4px; }
  .vq td{ padding:10px 14px; font-weight:600; font-size:14px; }
  .vq tr.row td:first-child{ border-radius:8px 0 0 8px; background:var(--panel); }
  .vq tr.row td:last-child{ border-radius:0 8px 8px 0; color:#fff; }
  .vq td.adesivos{ background:#A5271C; }
  .vq td.especialidades{ background:#2E7D4F; }
  .vq td.hub{ background:#C99A1B; color:#1B1B18 !important; }
  .vq td.plasticos{ background:#2E86AB; }
  .vq td.papeis{ background:#8E5AA6; }

  .aviso{
    margin-top:26px; padding:14px 18px; border-radius:10px;
    background:var(--talvez-bg); border-left:4px solid var(--orange);
    font-weight:700; font-size:13.5px; color:var(--orange-deep);
  }

  footer{ margin-top:36px; padding-top:12px; border-top:1px solid var(--line); font-size:11.5px; color:var(--ink-dim); }

  @media (max-width:900px){
    .funnel{ grid-template-columns:1fr; }
    .lower{ grid-template-columns:1fr; }
    .kicker{ margin-left:0; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="brand">PIGATTO <em>DISTRIBUIDORA</em></div>
    <div class="status" id="statusText"></div>
  </header>

  <div class="title-row">
    <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <circle cx="50" cy="50" r="46" fill="#E8631C"/>
      <g stroke="#FFDDA8" stroke-width="2" opacity="0.9">
        <line x1="50" y1="50" x2="50" y2="8"/>
        <line x1="50" y1="50" x2="82.6" y2="27.4"/>
        <line x1="50" y1="50" x2="88.9" y2="65.4"/>
        <line x1="50" y1="50" x2="68.1" y2="88.6"/>
        <line x1="50" y1="50" x2="31.9" y2="88.6"/>
        <line x1="50" y1="50" x2="11.1" y2="65.4"/>
        <line x1="50" y1="50" x2="17.4" y2="27.4"/>
      </g>
      <circle cx="50" cy="50" r="8" fill="#FFDDA8"/>
    </svg>
    <h1>OPERAÇÃO <i>ESPREMENDO A LARANJA</i></h1>
  </div>
  <p class="kicker" id="kicker"></p>

  <div class="funnel">
    <div class="fcard">
      <div class="fcard-top talvez"></div>
      <div class="fcard-head"><span class="fcard-label talvez">TALVEZ</span><span class="fcard-total" id="talvezTotal">—</span></div>
      <ul id="talvezItems"></ul>
    </div>
    <div class="fcard">
      <div class="fcard-top certeza"></div>
      <div class="fcard-head"><span class="fcard-label certeza">CERTEZA</span><span class="fcard-total" id="certezaTotal">—</span></div>
      <ul id="certezaItems"></ul>
    </div>
    <div class="fcard">
      <div class="fcard-top todos"></div>
      <div class="fcard-head"><span class="fcard-label todos">TODOS</span><span class="fcard-total" id="todosTotal">—</span></div>
      <ul id="todosItems"></ul>
    </div>
  </div>

  <div class="goal">
    <span class="num" id="goalNum">—</span>
    <span class="lbl">NOVO OBJETIVO TOPO DE FUNIL</span>
  </div>

  <h2>Ações por área</h2>
  <table class="acoes">
    <tr>
      <th></th>
      <th class="adesivos">Adesivos</th>
      <th class="especialidades">Especialidades</th>
      <th class="hub">HUB</th>
      <th class="plasticos">Plasticos de Eng</th>
      <th class="papeis">Papeis</th>
    </tr>
    <tbody id="acoesBody"></tbody>
  </table>

  <div class="lower">
    <div class="revisar" id="revisar"></div>
    <div>
      <table class="vq">
        <tr><th>Valor</th><th>Quem</th></tr>
        <tbody id="valorQuemBody"></tbody>
      </table>
      <div class="aviso" id="aviso"></div>
    </div>
  </div>

  <footer><span id="updated"></span></footer>

</div>

<script>
  const DATA_URL = 'espremendo-laranja-data.json';
  const REFRESH_MS = 60000;

  function fmtBRL(v){
    return 'R$ ' + Number(v).toLocaleString('pt-BR', {minimumFractionDigits:2, maximumFractionDigits:2});
  }

  function render(data){
    document.getElementById('talvezTotal').textContent = fmtBRL(data.talvez.total);
    document.getElementById('talvezItems').innerHTML = data.talvez.itens.map(function(i){
      return '<li><span class="name">'+i.nome+'</span><span class="val">'+fmtBRL(i.valor)+'</span></li>';
    }).join('');

    document.getElementById('certezaTotal').textContent = fmtBRL(data.certeza.total);
    document.getElementById('certezaItems').innerHTML = data.certeza.itens.map(function(i){
      return '<li><span class="name">'+i.nome+'</span><span class="val">'+fmtBRL(i.valor)+'</span></li>';
    }).join('');

    document.getElementById('todosTotal').textContent = fmtBRL(data.pipeline_atual.total);
    const todosItens = data.talvez.itens.concat(data.certeza.itens);
    document.getElementById('todosItems').innerHTML = todosItens.map(function(i){
      return '<li><span class="val">'+fmtBRL(i.valor)+'</span></li>';
    }).join('');

    document.getElementById('goalNum').textContent = fmtBRL(data.novo_topo_funil);

    document.getElementById('acoesBody').innerHTML = [1,2,3].map(function(n){
      return '<tr><td>'+n+'</td>' + data.acoes_por_area.map(function(a){
        return '<td>'+(a.itens[n-1]||'')+'</td>';
      }).join('') + '</tr>';
    }).join('');

    document.getElementById('revisar').innerHTML =
      '<div class="grupo"><b>'+data.revisar_clientes.titulo+'</b>' +
      data.revisar_clientes.itens.map(function(i){ return '<p>'+i+'</p>'; }).join('') + '</div>' +
      '<div class="grupo"><b>'+data.produtos_vencendo.titulo+'</b>' +
      data.produtos_vencendo.itens.map(function(i){ return '<p>'+i+'</p>'; }).join('') + '</div>';

    document.getElementById('valorQuemBody').innerHTML = data.distribuicao_por_area.map(function(d){
      return '<tr class="row"><td>'+fmtBRL(d.valor)+'</td><td class="'+d.classe+'">'+d.area+'</td></tr>';
    }).join('');

    document.getElementById('aviso').textContent = data.aviso || '';

    const dt = new Date(data.atualizado_em);
    document.getElementById('updated').textContent = 'Atualizado ' + dt.toLocaleString('pt-BR');
    document.getElementById('statusText').textContent = dt.toLocaleTimeString('pt-BR');
    document.getElementById('kicker').textContent = 'Atualizado automaticamente';
  }

  let lastGood = null;
  async function load(){
    try{
      const res = await fetch(DATA_URL + '?_=' + Date.now(), {cache:'no-store'});
      if(!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();
      lastGood = data;
      render(data);
    } catch(e){
      if(lastGood) render(lastGood);
    }
  }
  load();
  setInterval(load, REFRESH_MS);
</script>
</body>
</html>
