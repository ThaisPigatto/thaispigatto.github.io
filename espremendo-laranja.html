<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OPERAÇÃO ESPREMENDO A LARANJA — Grupo Pigatto</title>
<style>
  :root{
    --ink: #1D1D1B;
    --ink-dim: #6B6B66;
    --line: #DDDAD2;
    --orange: #E8631C;
    --talvez: #FFEB3B;
    --certeza: #A9D8B8;
    --todos: #AEDCF5;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:#FFFFFF;
    color: var(--ink);
    font-family: Arial, Helvetica, sans-serif;
  }
  .wrap{ max-width: 1100px; margin: 0 auto; padding: 28px 24px 48px; }

  header{ display:flex; align-items:center; gap:14px; padding-bottom:16px; border-bottom: 2px solid var(--ink); margin-bottom: 24px; }
  .brand{ font-weight:bold; font-size:15px; letter-spacing:0.02em; }
  .brand span{ font-weight:normal; color: var(--ink-dim); }
  .status{ margin-left:auto; font-size:12px; color: var(--ink-dim); }

  .title-row{ display:flex; align-items:center; gap:14px; margin-bottom: 28px; }
  .title-row svg{ width:36px; height:36px; flex-shrink:0; }
  h1{ font-size: 26px; margin:0; font-weight:bold; }
  h1 span{ color: var(--orange); }

  h2{ font-size: 17px; margin: 30px 0 12px; }

  table{ border-collapse:collapse; width:100%; }
  th{ text-align:center; font-size:14px; padding:8px; border:1px solid var(--line); }
  th.talvez{ background:var(--talvez); }
  th.certeza{ background:var(--certeza); }
  th.todos{ background:var(--todos); }
  td{ padding:7px 10px; border:1px solid var(--line); font-size:13.5px; white-space:nowrap; }
  td.v{ font-weight:normal; }
  tr.total td{ font-weight:bold; }
  tr.total td.talvez{ background:var(--talvez); }
  tr.total td.certeza{ background:var(--certeza); }
  tr.total td.todos{ background:var(--todos); }

  .funnel{ display:grid; grid-template-columns: repeat(3, 1fr); gap: 0; }
  .funnel table{ height:100%; }

  .objetivo{ font-weight:bold; font-size:16px; margin: 8px 0 14px; }
  .objetivo b{ color: var(--orange); }

  .acoes-table th{ font-size:13px; }
  .acoes-table td{ font-size:13px; white-space:normal; }
  th.adesivos{ background:#B3161C; color:#fff; }
  th.especialidades{ background:#4CAF50; color:#fff; }
  th.hub{ background:#FFEB3B; }
  th.plasticos{ background:#4FC3F7; }
  th.papeis{ background:#E1A6E8; }

  .revisar{ margin-top: 26px; }
  .revisar p{ margin:3px 0; font-size:14px; }
  .revisar b{ display:block; margin-top:14px; }

  .valor-quem{ max-width:380px; margin-top:14px; }
  .valor-quem td{ font-weight:bold; }
  td.adesivos{ background:#B3161C; color:#fff; }
  td.especialidades{ background:#4CAF50; color:#fff; }
  td.hub{ background:#FFEB3B; }
  td.plasticos{ background:#4FC3F7; }
  td.papeis{ background:#E1A6E8; }

  .aviso{ color:#E8631C; font-weight:bold; font-size:14px; margin-top:20px; }

  footer{ margin-top:32px; padding-top:12px; border-top:1px solid var(--line); font-size:11px; color: var(--ink-dim); }

  @media (max-width: 720px){ .funnel{ grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="brand">PIGATTO <span>DISTRIBUIDORA</span></div>
    <span class="status" id="statusText"></span>
  </header>

  <div class="title-row">
    <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <circle cx="50" cy="50" r="46" fill="#E8631C"/>
      <g stroke="#FFDDA8" stroke-width="2" opacity="0.9">
        <line x1="50" y1="50" x2="50" y2="8"/>
        <line x1="50" y1="50" x2="82.6" y2="27.4"/>
        <line x1="50" y1="50" x2="88.9" y2="65.4"/>
        <line x1="50" y1="50" x2="68.1" y2="88.6"/>
        <line x1="50" y1="50" x2="31.9" y2="88.6"/>
        <line x1="50" y1="50" x2="11.1" y2="65.4"/>
        <line x1="50" y1="50" x2="17.4" y2="27.4"/>
      </g>
      <circle cx="50" cy="50" r="8" fill="#FFDDA8"/>
    </svg>
    <h1>OPERAÇÃO <span>ESPREMENDO A LARANJA</span></h1>
  </div>

  <div class="funnel">
    <table id="talvezTable">
      <tr><th class="talvez">TALVEZ</th></tr>
    </table>
    <table id="certezaTable">
      <tr><th class="certeza">CERTEZA</th></tr>
    </table>
    <table id="todosTable">
      <tr><th class="todos">TODOS</th></tr>
    </table>
  </div>

  <div class="objetivo" id="objetivo"></div>

  <table class="acoes-table">
    <tr>
      <th></th>
      <th class="adesivos">Adesivos</th>
      <th class="especialidades">Especialidades</th>
      <th class="hub">HUB</th>
      <th class="plasticos">Plasticos de Eng</th>
      <th class="papeis">Papeis</th>
    </tr>
    <tbody id="acoesBody"></tbody>
  </table>

  <div class="revisar" id="revisar"></div>

  <table class="valor-quem" id="valorQuemTable">
    <tr><th>Valor</th><th>Quem</th></tr>
  </table>

  <div class="aviso" id="aviso"></div>

  <footer>
    <span id="updated"></span>
  </footer>

</div>

<script>
  const DATA_URL = 'espremendo-laranja-data.json';
  const REFRESH_MS = 60000;

  function fmtBRL(v){
    return 'R$ ' + Number(v).toLocaleString('pt-BR', {minimumFractionDigits:2, maximumFractionDigits:2});
  }

  function buildCol(tableId, cls, itens, total){
    const rows = itens.map(function(i){
      return '<tr><td class="' + cls + ' v">' + fmtBRL(i.valor) + '</td><td>' + i.nome + '</td></tr>';
    }).join('');
    document.getElementById(tableId).innerHTML =
      '<tr><th class="' + cls + '" colspan="2">' + document.getElementById(tableId).querySelector('th').textContent + '</th></tr>' +
      rows +
      '<tr class="total"><td class="' + cls + '">TOTAL</td><td class="' + cls + '">' + fmtBRL(total) + '</td></tr>';
  }

  function render(data){
    buildCol('talvezTable', 'talvez', data.talvez.itens, data.talvez.total);
    buildCol('certezaTable', 'certeza', data.certeza.itens, data.certeza.total);

    const todosItens = data.talvez.itens.concat(data.certeza.itens).map(function(i){ return {valor: i.valor, nome: ''}; });
    const rowsTodos = todosItens.map(function(i){ return '<tr><td class="todos v">' + fmtBRL(i.valor) + '</td></tr>'; }).join('');
    document.getElementById('todosTable').innerHTML =
      '<tr><th class="todos">TODOS</th></tr>' + rowsTodos +
      '<tr class="total"><td class="todos">TOTAL&nbsp;&nbsp;' + fmtBRL(data.pipeline_atual.total) + '</td></tr>';

    document.getElementById('objetivo').innerHTML = fmtBRL(data.novo_topo_funil) + ' <b>NOVO OBJETIVO TOPO DE FUNIL</b>';

    document.getElementById('acoesBody').innerHTML =
      [1,2,3].map(function(n){
        return '<tr><td>' + n + '</td>' + data.acoes_por_area.map(function(a){ return '<td>' + (a.itens[n-1] || '') + '</td>'; }).join('') + '</tr>';
      }).join('');

    document.getElementById('revisar').innerHTML =
      '<b>' + data.revisar_clientes.titulo + '</b>' +
      data.revisar_clientes.itens.map(function(i){ return '<p>' + i + '</p>'; }).join('') +
      '<b>' + data.produtos_vencendo.titulo + '</b>' +
      data.produtos_vencendo.itens.map(function(i){ return '<p>' + i + '</p>'; }).join('');

    document.getElementById('valorQuemTable').innerHTML =
      '<tr><th>Valor</th><th>Quem</th></tr>' +
      data.distribuicao_por_area.map(function(d){
        return '<tr><td>' + fmtBRL(d.valor) + '</td><td class="' + d.classe + '">' + d.area + '</td></tr>';
      }).join('');

    document.getElementById('aviso').textContent = data.aviso || '';

    const dt = new Date(data.atualizado_em);
    document.getElementById('updated').textContent = 'Atualizado ' + dt.toLocaleString('pt-BR');
    document.getElementById('statusText').textContent = dt.toLocaleTimeString('pt-BR');
  }

  let lastGood = null;

  async function load(){
    try{
      const res = await fetch(DATA_URL + '?_=' + Date.now(), {cache:'no-store'});
      if(!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();
      lastGood = data;
      render(data);
    } catch(e){
      if(lastGood) render(lastGood);
    }
  }

  load();
  setInterval(load, REFRESH_MS);
</script>
</body>
</html>
