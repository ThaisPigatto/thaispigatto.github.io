<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  --navy:#0F2D5C;--orange:#F7941D;--ink:#0E2A47;--muted:#5B6B80;--line:#E3E9F0;--bg:#F3F6FA;--card:#FFFFFF;
  --ok:#2E9E4F;--bad:#D64545;--display:"Sora","Segoe UI",system-ui,sans-serif;--body:"Figtree","Segoe UI",system-ui,sans-serif}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15.5px;line-height:1.45}
.wrap{max-width:1180px;margin:0 auto;padding:18px 20px 44px}
.hidden{display:none!important}
.top{display:flex;align-items:center;gap:16px;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 20px}
.top .logo{height:52px;mix-blend-mode:multiply}
.top .tit{flex:1;min-width:200px}
.top h1{font-family:var(--display);font-size:clamp(20px,2.6vw,26px);margin:0;font-weight:800}
.top .sub{font-size:13.5px;color:var(--muted)}
.eu{display:flex;align-items:center;gap:10px}
.eu img{width:56px;height:56px;border-radius:50%;object-fit:cover;border:3px solid var(--orange)}
.eu strong{display:block;font-family:var(--display)}
.eu small{color:var(--muted)}
.btn{font:700 14.5px var(--body);border-radius:10px;padding:9px 16px;border:1px solid var(--line);background:#fff;color:var(--ink);cursor:pointer}
.btn:hover{border-color:var(--navy)}
.btn.laranja{background:var(--orange);border-color:var(--orange);color:#fff}
.btn.verde{background:var(--ok);border-color:var(--ok);color:#fff}
.btn:disabled{opacity:.6;cursor:wait}
.btn:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,.pessoa:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px 22px;margin-top:16px}
.card h2{font-family:var(--display);font-size:19px;margin:0 0 4px}
.card .sub{color:var(--muted);font-size:14px;margin:0 0 14px}
/* login */
.equipe{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:22px;margin-top:20px}
.pessoa{background:none;border:0;cursor:pointer;text-align:center;font:inherit;color:inherit;padding:8px;border-radius:16px}
.pessoa img{width:118px;height:118px;border-radius:50%;object-fit:cover;border:4px solid #fff;box-shadow:0 8px 22px rgba(15,45,92,.22);animation:flutua 4s ease-in-out infinite}
.pessoa:nth-child(2n) img{animation-delay:-1.3s}.pessoa:nth-child(3n) img{animation-delay:-2.6s}
.pessoa:hover img{border-color:var(--orange)}
.pessoa strong{display:block;font-family:var(--display);margin-top:10px}
.pessoa small{color:var(--muted)}
@keyframes flutua{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@media (prefers-reduced-motion:reduce){.pessoa img{animation:none}}
.login{max-width:420px;margin:10px auto 0;text-align:center}
.login img{width:110px;height:110px;border-radius:50%;object-fit:cover;border:4px solid var(--orange)}
.login input{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;font:inherit;margin-top:10px}
.erro{color:#B42318;font-weight:600;margin-top:10px}
/* painel */
.nav{display:flex;gap:6px;flex-wrap:wrap;background:var(--navy);border-radius:16px;padding:10px 12px;margin-top:14px}
.nav button{border:0;background:transparent;color:#fff;font:600 15px var(--body);padding:9px 16px;border-radius:10px;cursor:pointer}
.nav button[aria-selected="true"]{background:var(--orange)}
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-top:16px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.kpi .lb{font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.kpi .vl{font-family:var(--display);font-size:26px;font-weight:800}
.kpi.vermelho .vl{color:var(--bad)}
@media (max-width:900px){.kpis{grid-template-columns:repeat(2,1fr)}}
.filtros{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:16px}
.filtros select,.filtros input{padding:9px 12px;border-radius:10px;border:1px solid var(--line);font:inherit;background:#fff}
.lista{display:grid;gap:12px;margin-top:14px}
.ch{background:#fff;border:1px solid var(--line);border-left:7px solid var(--u);border-radius:14px;padding:14px 18px}
.ch.alvo{box-shadow:0 0 0 3px var(--orange)}
.ch .l1{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.ch .prot{font-family:var(--display);font-weight:800}
.pill{display:inline-block;font-size:12.5px;font-weight:700;padding:3px 10px;border-radius:999px}
.u-Baixa{--u:#2E9E4F}.u-Média{--u:#E0A800}.u-Alta{--u:#D64545}
.pill.Baixa{background:#E3F5E8;color:#1E7A3C}.pill.Média{background:#FFF4CC;color:#8A6400}.pill.Alta{background:#FCE7E7;color:#B42318}
.pill.venc{background:#D64545;color:#fff}.pill.prazo{background:#EEF2F6;color:var(--muted)}
.pill.sim{background:#E3F5E8;color:#1E7A3C}.pill.nao{background:#FCE7E7;color:#B42318}
.ch .meta{font-size:13.5px;color:var(--muted);margin-top:6px}
.ch .txt{margin-top:8px;white-space:pre-wrap}
.ch .resp{margin-top:10px;background:#F7F9FC;border-radius:10px;padding:10px 12px;font-size:14.5px}
.ch .acoes{margin-top:12px;display:flex;gap:8px;flex-wrap:wrap}
.fin{margin-top:12px;border-top:1px dashed var(--line);padding-top:12px;display:grid;gap:10px}
.fin textarea{min-height:90px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;font:inherit}
.radios{display:flex;gap:10px;flex-wrap:wrap}
.radios label{display:flex;gap:6px;align-items:center;font-weight:700;padding:7px 14px;border-radius:10px;cursor:pointer}
.r-sim{background:#E3F5E8;color:#1E7A3C}.r-nao{background:#FCE7E7;color:#B42318}
.vazio{color:var(--muted);padding:20px;text-align:center;background:#fff;border-radius:14px;border:1px dashed var(--line)}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:14px}
table{width:100%;border-collapse:collapse;font-size:14.5px;background:#fff}
th,td{padding:9px 12px;text-align:right;border-top:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
thead th{background:var(--navy);color:#fff;font-family:var(--display);font-size:13px;border-top:0}
.vk{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
@media (max-width:900px){.vk{grid-template-columns:1fr 1fr}}
.trk{position:relative;height:42px;border-radius:12px;margin-top:30px}
.trk .bg{position:absolute;inset:0;border-radius:12px}
.trk .fill{position:absolute;left:0;top:0;bottom:0;background:#45D35B;border-radius:12px 0 0 12px}
.trk .pc{position:absolute;top:50%;transform:translateY(-50%);font-family:var(--display);font-weight:800}
.lbl{text-align:center;font-weight:700;font-size:13px;color:var(--muted);letter-spacing:.05em;margin-top:6px}
.foot{font-size:12.5px;color:var(--muted)}
</style>
</head>

    <div class="tit"><h1>Chamados / Suporte</h1><div class="sub">Solicitações dos vendedores · cada pessoa vê e finaliza os chamados que recebeu</div></div>
    <div class="eu hidden" id="eu"><img id="euFoto" alt=""><div><strong id="euNome"></strong><small id="euCargo"></small></div><button class="btn" id="sair">Sair</button></div>
  </header>

  <section id="vLogin">
    <div class="card" id="escolha"><h2>Quem é você?</h2><p class="sub">Clique na sua foto. No primeiro acesso você cria a sua senha.</p><div class="equipe" id="equipe"></div></div>
    <div class="card hidden" id="senhaBox"><div class="login">
      <img id="lFoto" alt=""><h2 id="lNome" style="margin-top:10px"></h2><p class="sub" id="lInfo"></p>
      <input type="password" id="s1" autocomplete="current-password" placeholder="Senha">
      <input type="password" id="s2" class="hidden" autocomplete="new-password" placeholder="Repita a senha">
      <div style="display:flex;gap:8px;justify-content:center;margin-top:14px"><button class="btn" id="voltar">Voltar</button><button class="btn laranja" id="entrar">Entrar</button></div>
      <div class="erro" id="lErro" role="alert"></div>
    </div></div>
  </section>

  <section id="vPainel" class="hidden">
    <nav class="nav" role="tablist">
      <button role="tab" data-tab="abertos" aria-selected="true">Em aberto</button>
      <button role="tab" data-tab="finalizados" aria-selected="false">Finalizados</button>
      <button role="tab" data-tab="equipe" aria-selected="false" class="hidden" id="tabEquipe">Equipe</button>
    </nav>
    <div id="pChamados">
      <div class="kpis" id="kpis"></div>
      <div class="filtros"><span id="filtroPara" class="hidden"><b>Para:</b> <select id="fPara"></select></span><b>Urgência:</b><select id="fUrg"><option value="">Todas</option><option>Alta</option><option>Média</option><option>Baixa</option></select>
        <input id="fBusca" placeholder="Buscar vendedor, protocolo ou texto"><span class="foot" id="atualizado"></span></div>
      <div class="lista" id="lista"></div>
    </div>
    <div id="pEquipe" class="hidden"></div>
  </section>
</div>

<script src="suporte.js"></script>
<script>
const API = 'https://script.google.com/macros/s/AKfycbxAfTiOwt-qhyn3vjy-uhFkd7LiC-Jxb05xseGaq3PuLKBEZ310GwUx4G559MFHZg_Lug/exec';
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const EQ = window.SUPORTE || [];
const quem = id => EQ.find(p => p.id === id) || {};
const dt = s => s ? new Date(s).toLocaleString('pt-BR', {day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit'}) : '—';
function dur(ms){ const h = Math.abs(ms) / 36e5; return h < 1 ? Math.round(h*60) + ' min' : h < 48 ? h.toFixed(h < 10 ? 1 : 0).replace('.', ',') + ' h' : Math.round(h/24) + ' dias'; }
const brl = v => (v||0).toLocaleString('pt-BR', {style:'currency', currency:'BRL'});
const pct = x => x == null ? '—' : (x*100).toLocaleString('pt-BR', {minimumFractionDigits:1, maximumFractionDigits:1}) + '%';

let USER = null, SENHA = null, ADMIN = false, CH = [], TAB = 'abertos', ALVO = (location.hash.match(/c=([\w-]+)/) || [])[1] || null, SEL = null, TEM = false;

async function api(corpo){ const r = await fetch(API, { method:'POST', body: JSON.stringify(corpo) }); return r.json(); }

/* ---------- login ---------- */
function telaEquipe(){
  $('equipe').innerHTML = EQ.map(p => `<button class="pessoa" data-id="${p.id}"><img src="${p.foto}" alt=""><strong>${esc(p.nome)}</strong><small>${esc(p.cargo)}</small></button>`).join('');
  document.querySelectorAll('.pessoa').forEach(b => b.onclick = () => escolher(b.dataset.id));
}
async function escolher(id){
  SEL = id; const p = quem(id);
  $('escolha').classList.add('hidden'); $('senhaBox').classList.remove('hidden');
  $('lFoto').src = p.foto; $('lNome').textContent = p.nome; $('lInfo').textContent = 'Verificando…'; $('lErro').textContent = '';
  $('s1').value = ''; $('s2').value = '';
  try { const j = await api({ acao:'usuario', user:id }); if (!j.ok) throw 0; TEM = j.temSenha; }
  catch(e){ $('lInfo').textContent = 'Não foi possível conectar agora. Tente de novo em instantes.'; return; }
  $('s2').classList.toggle('hidden', TEM);
  $('lInfo').textContent = TEM ? 'Digite a sua senha.' : 'Primeiro acesso: crie a sua senha (mínimo 6 caracteres).';
  $('s1').placeholder = TEM ? 'Senha' : 'Crie uma senha'; $('entrar').textContent = TEM ? 'Entrar' : 'Criar senha e entrar';
  $('s1').focus();
}
$('voltar').onclick = () => { $('senhaBox').classList.add('hidden'); $('escolha').classList.remove('hidden'); };
$('s1').onkeydown = $('s2').onkeydown = e => { if (e.key === 'Enter') $('entrar').click(); };
$('entrar').onclick = async () => {
  const s1 = $('s1').value, s2 = $('s2').value, err = $('lErro'); err.textContent = '';
  if (!TEM){ if (s1.length < 6){ err.textContent = 'A senha precisa ter pelo menos 6 caracteres.'; return; } if (s1 !== s2){ err.textContent = 'As duas senhas não são iguais.'; return; } }
  const b = $('entrar'); b.disabled = true;
  try {
    const j = await api({ acao: TEM ? 'entrar' : 'criar-senha', user: SEL, senha: s1 });
    if (!j.ok){ err.textContent = j.erro === 'senha' ? 'Senha incorreta.' : j.erro === 'ja-tem-senha' ? 'Esta pessoa já tem senha. Volte e entre de novo.' : 'Não foi possível entrar.'; return; }
    USER = SEL; SENHA = s1; ADMIN = !!j.usuario.admin;
    try { sessionStorage.setItem('sup', JSON.stringify({u:USER, s:SENHA})); } catch(e){}
    await entrarPainel();
  } catch(e){ err.textContent = 'Sem conexão com a planilha agora.'; }
  finally { b.disabled = false; }
};
$('sair').onclick = () => { try { sessionStorage.removeItem('sup'); } catch(e){} location.hash = ''; location.reload(); };

/* ---------- painel ---------- */
async function entrarPainel(){
  const p = quem(USER);
  $('vLogin').classList.add('hidden'); $('vPainel').classList.remove('hidden'); $('eu').classList.remove('hidden');
  $('euFoto').src = p.foto; $('euNome').textContent = p.nome; $('euCargo').textContent = p.cargo + (ADMIN ? ' · gestão' : '');
  $('tabEquipe').classList.toggle('hidden', !ADMIN); $('filtroPara').classList.toggle('hidden', !ADMIN);
  $('fPara').innerHTML = '<option value="">Todos</option>' + EQ.map(x => `<option value="${x.id}">${esc(x.nome)}</option>`).join('');
  await carregar();
  if (ALVO){ const c = CH.find(x => x.protocolo === ALVO); if (c) abrirAba(c.status === 'Finalizado' ? 'finalizados' : 'abertos'); }
  if (!window._t) window._t = setInterval(() => { if (!document.querySelector('.fin:not(.hidden)')) carregar(); }, 120000);
}
async function carregar(){
  try { const j = await api({ acao:'meus-chamados', user:USER, senha:SENHA });
    if (!j.ok){ if (j.erro === 'senha'){ alert('A sua senha mudou. Entre de novo.'); $('sair').click(); } return; }
    CH = j.chamados; $('atualizado').textContent = 'Atualizado às ' + new Date().toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'});
    render(); }
  catch(e){ $('atualizado').textContent = 'Sem conexão com a planilha. Tentando de novo em 2 minutos.'; }
}
function abrirAba(t){
  TAB = t; document.querySelectorAll('.nav button').forEach(b => b.setAttribute('aria-selected', b.dataset.tab === t));
  $('pChamados').classList.toggle('hidden', !['abertos','finalizados'].includes(t)); $('pEquipe').classList.toggle('hidden', t !== 'equipe');
  if (t === 'equipe') equipe(); else render();
}
document.querySelectorAll('.nav button').forEach(b => b.onclick = () => abrirAba(b.dataset.tab));
['fPara','fUrg'].forEach(id => $(id).onchange = render); $('fBusca').oninput = render;

function indicadores(lista){
  const agora = Date.now(), ab = lista.filter(c => c.status !== 'Finalizado'), fin = lista.filter(c => c.status === 'Finalizado');
  const venc = ab.filter(c => c.prazo && new Date(c.prazo) < agora).length;
  const tempos = fin.filter(c => c.finalizadoEm && c.abertoEm).map(c => new Date(c.finalizadoEm) - new Date(c.abertoEm));
  const medio = tempos.length ? tempos.reduce((a,b) => a + b, 0) / tempos.length : null;
  const noPrazo = fin.filter(c => c.prazo && c.finalizadoEm && new Date(c.finalizadoEm) <= new Date(c.prazo)).length;
  return { ab: ab.length, venc, fin: fin.length, medio, resolv: fin.length ? fin.filter(c => c.resolvido === 'Sim').length / fin.length : null, noPrazo: fin.length ? noPrazo / fin.length : null };
}
function render(){
  const fp = ADMIN ? $('fPara').value : '', fu = $('fUrg').value, fb = $('fBusca').value.trim().toLowerCase();
  const base = CH.filter(c => !fp || c.paraId === fp);
  const k = indicadores(base);
  document.querySelector('[data-tab=abertos]').textContent = `Em aberto (${k.ab})`;
  document.querySelector('[data-tab=finalizados]').textContent = `Finalizados (${k.fin})`;
  $('kpis').innerHTML = `<div class="kpi"><div class="lb">Em aberto</div><div class="vl">${k.ab}</div></div>
    <div class="kpi ${k.venc ? 'vermelho' : ''}"><div class="lb">Vencidos</div><div class="vl">${k.venc}</div></div>
    <div class="kpi"><div class="lb">Finalizados</div><div class="vl">${k.fin}</div></div>
    <div class="kpi"><div class="lb">Tempo médio de resposta</div><div class="vl">${k.medio == null ? '—' : dur(k.medio)}</div></div>
    <div class="kpi"><div class="lb">Resolvidos · no prazo</div><div class="vl" style="font-size:20px">${pct(k.resolv)} · ${pct(k.noPrazo)}</div></div>`;
  const ordemUrg = {Alta:0, 'Média':1, Baixa:2};
  let rs = base.filter(c => (TAB === 'finalizados') === (c.status === 'Finalizado'))
    .filter(c => !fu || c.urgencia === fu)
    .filter(c => !fb || [c.protocolo, c.vendedor, c.setor, c.solicitacao, c.paraNome].join(' ').toLowerCase().includes(fb));
  if (TAB === 'abertos') rs.sort((a,b) => (ordemUrg[a.urgencia] - ordemUrg[b.urgencia]) || (new Date(a.prazo) - new Date(b.prazo)));
  const agora = Date.now();
  $('lista').innerHTML = rs.length ? rs.map(c => {
    const vencido = c.status !== 'Finalizado' && c.prazo && new Date(c.prazo) < agora;
    const prazoTxt = c.status === 'Finalizado' ? '' : vencido ? `<span class="pill venc">VENCIDO há ${dur(agora - new Date(c.prazo))}</span>` : `<span class="pill prazo">vence em ${dur(new Date(c.prazo) - agora)}</span>`;
    return `<article class="ch u-${esc(c.urgencia)} ${c.protocolo === ALVO ? 'alvo' : ''}" id="ch-${esc(c.protocolo)}">
      <div class="l1"><span class="prot">${esc(c.protocolo)}</span><span class="pill ${esc(c.urgencia)}">${esc(c.urgencia)}</span>${prazoTxt}
        ${c.status === 'Finalizado' ? `<span class="pill ${c.resolvido === 'Sim' ? 'sim' : 'nao'}">${c.resolvido === 'Sim' ? 'Resolvido' : 'Não resolvido'}</span>` : ''}</div>
      <div class="meta"><b>De:</b> ${esc(c.vendedor)} · ${esc(c.setor)} · <a href="mailto:${esc(c.email)}?subject=${encodeURIComponent('Chamado ' + c.protocolo)}">${esc(c.email)}</a>${ADMIN ? ` &nbsp;|&nbsp; <b>Para:</b> ${esc(c.paraNome)}` : ''} &nbsp;|&nbsp; aberto em ${dt(c.abertoEm)}</div>
      <div class="txt">${esc(c.solicitacao)}</div>
      ${c.status === 'Finalizado' ? `<div class="resp"><b>Desfecho:</b> ${esc(c.desfecho || '(sem descrição)')}<br><span class="foot">Finalizado por ${esc(c.finalizadoPor)} em ${dt(c.finalizadoEm)} · tempo de resposta ${dur(new Date(c.finalizadoEm) - new Date(c.abertoEm))}</span></div>
        <div class="acoes"><button class="btn" data-reabrir="${esc(c.protocolo)}">Reabrir</button></div>` :
        `<div class="acoes"><button class="btn verde" data-fin="${esc(c.protocolo)}">Finalizar chamado</button></div>
         <div class="fin hidden" id="fin-${esc(c.protocolo)}"><div class="radios"><b style="align-self:center">Foi resolvido?</b>
           <label class="r-sim"><input type="radio" name="r-${esc(c.protocolo)}" value="Sim" checked> Sim</label><label class="r-nao"><input type="radio" name="r-${esc(c.protocolo)}" value="Não"> Não</label></div>
           <textarea id="d-${esc(c.protocolo)}" placeholder="Desfecho (opcional): o que foi feito ou combinado. O vendedor vai ver esta resposta."></textarea>
           <div><button class="btn verde" data-conf="${esc(c.protocolo)}">Confirmar e finalizar</button> <button class="btn" data-canc="${esc(c.protocolo)}">Cancelar</button></div></div>`}
    </article>`; }).join('') : `<div class="vazio">${TAB === 'abertos' ? 'Nenhum chamado em aberto. 🎉' : 'Nenhum chamado finalizado ainda.'}</div>`;
  document.querySelectorAll('[data-fin]').forEach(b => b.onclick = () => { $('fin-' + b.dataset.fin).classList.remove('hidden'); b.classList.add('hidden'); });
  document.querySelectorAll('[data-canc]').forEach(b => b.onclick = () => render());
  document.querySelectorAll('[data-conf]').forEach(b => b.onclick = () => finalizar(b.dataset.conf, b));
  document.querySelectorAll('[data-reabrir]').forEach(b => b.onclick = () => reabrir(b.dataset.reabrir));
  if (ALVO){ const el = $('ch-' + ALVO); if (el){ el.scrollIntoView({behavior:'smooth', block:'center'}); const f = el.querySelector('[data-fin]'); if (f) f.click(); ALVO = null; } }
}
async function finalizar(prot, btn){
  const resolvido = (document.querySelector(`input[name="r-${prot}"]:checked`) || {}).value || 'Sim', desfecho = $('d-' + prot).value.trim();
  btn.disabled = true; btn.textContent = 'Finalizando…';
  try { const j = await api({ acao:'finalizar', user:USER, senha:SENHA, protocolo:prot, resolvido, desfecho });
    if (!j.ok) throw new Error(j.erro === 'permissao' ? 'Este chamado não é seu.' : 'Não foi possível finalizar.'); CH = j.chamados; render(); }
  catch(e){ alert(e.message || 'Sem conexão com a planilha.'); btn.disabled = false; btn.textContent = 'Confirmar e finalizar'; }
}
async function reabrir(prot){
  if (!confirm(`Reabrir o chamado ${prot}? Ele volta para "Em aberto".`)) return;
  try { const j = await api({ acao:'reabrir', user:USER, senha:SENHA, protocolo:prot }); if (j.ok){ CH = j.chamados; render(); } else alert('Não foi possível reabrir.'); }
  catch(e){ alert('Sem conexão com a planilha.'); }
}

/* ---------- equipe (só gestão) ---------- */
function equipe(){
  const linhas = EQ.map(p => { const k = indicadores(CH.filter(c => c.paraId === p.id));
    return `<tr><td><b>${esc(p.nome)}</b><br><span class="foot">${esc(p.cargo)}</span></td><td>${k.ab}</td><td style="color:${k.venc ? '#D64545' : 'inherit'};font-weight:${k.venc ? 800 : 400}">${k.venc}</td><td>${k.fin}</td><td>${k.medio == null ? '—' : dur(k.medio)}</td><td>${pct(k.resolv)}</td><td>${pct(k.noPrazo)}</td>
      <td>${p.id === USER ? '' : `<button class="btn" data-reset="${p.id}">Resetar senha</button>`}</td></tr>`; }).join('');
  $('pEquipe').innerHTML = `<div class="card"><h2>Equipe de suporte</h2><p class="sub">Chamados por responsável. "Resetar senha" apaga a senha da pessoa: no próximo acesso ela cria uma nova.</p>
    <div class="tw"><table><thead><tr><th>Responsável</th><th>Em aberto</th><th>Vencidos</th><th>Finalizados</th><th>Tempo médio</th><th>% resolvidos</th><th>% no prazo</th><th></th></tr></thead><tbody>${linhas}</tbody></table></div></div>`;
  document.querySelectorAll('[data-reset]').forEach(b => b.onclick = async () => {
    const p = quem(b.dataset.reset); if (!confirm(`Apagar a senha de ${p.nome}? No próximo acesso, ${p.nome.split(' ')[0]} cria uma nova.`)) return;
    const j = await api({ acao:'resetar-senha', user:USER, senha:SENHA, alvo:p.id }); alert(j.ok ? 'Senha apagada.' : 'Não foi possível.'); });
}

/* ---------- início ---------- */
telaEquipe();
(async () => { let s = null; try { s = JSON.parse(sessionStorage.getItem('sup')); } catch(e){}
  if (s && s.u && s.s){ try { const j = await api({ acao:'entrar', user:s.u, senha:s.s }); if (j.ok){ USER = s.u; SENHA = s.s; ADMIN = !!j.usuario.admin; await entrarPainel(); } } catch(e){} } })();
</script>
