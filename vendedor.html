<style>
:root{
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  --navy:#0F2D5C;--navy2:#003265;--orange:#F7941D;--ink:#0E2A47;--muted:#5B6B80;--line:#E3E9F0;--bg:#F3F6FA;--card:#FFFFFF;--panel:#F7F9FC;
  --ok:#2E9E4F;--warn:#D99400;--bad:#D64545;--fam:#2E75B6;
  --display:"Sora","Segoe UI",system-ui,sans-serif;--body:"Figtree","Segoe UI",system-ui,sans-serif;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15.5px;line-height:1.45;-webkit-font-smoothing:antialiased}
.wrap{max-width:1280px;margin:0 auto;padding:18px 20px 40px}
button,select,input,textarea{font:inherit}
.hidden{display:none!important}
/* cabeçalho */
.top{display:flex;align-items:center;gap:18px;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 20px}
.top .logo{height:54px;width:auto;display:block;mix-blend-mode:multiply}
.top .tit{flex:1;min-width:220px}
.top h1{font-family:var(--display);font-size:clamp(20px,2.6vw,26px);margin:0;font-weight:800}
.top .upd{font-size:13px;color:var(--muted);margin-top:2px}
.eu{display:flex;align-items:center;gap:12px}
.eu img{width:62px;height:62px;border-radius:50%;object-fit:cover;border:3px solid var(--fam);box-shadow:0 0 0 3px #fff}
.eu .who strong{display:block;font-family:var(--display);font-size:17px}
.eu .tag{display:inline-block;margin-top:4px;font-size:12.5px;font-weight:700;padding:4px 11px;border-radius:999px;background:color-mix(in srgb,var(--fam) 16%,#fff);box-shadow:inset 0 0 0 2px var(--fam)}
/* barra de abas */
.nav{display:flex;gap:6px;flex-wrap:wrap;align-items:center;background:var(--navy);border-radius:16px;padding:10px 12px;margin:14px 0 18px}
.nav button{border:0;background:transparent;color:#fff;font-weight:600;font-size:15px;padding:9px 16px;border-radius:10px;cursor:pointer}
.nav button:hover{background:rgba(255,255,255,.1)}
.nav button[aria-selected="true"]{background:var(--orange);color:#fff}
.nav button:focus-visible{outline:3px solid #fff;outline-offset:2px}
/* blocos */
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px 22px;margin-bottom:16px}
.card h2{font-family:var(--display);font-size:19px;margin:0 0 4px}
.card .sub{color:var(--muted);font-size:14px;margin:0 0 14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media (max-width:900px){.grid2,.grid4,.grid3{grid-template-columns:1fr 1fr}}
@media (max-width:560px){.grid2,.grid4,.grid3{grid-template-columns:1fr}.wrap{padding:12px 12px 30px}}
.kpi{border:1px solid var(--line);border-radius:14px;padding:14px 16px;background:var(--card)}
.kpi .lb{font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.kpi .vl{font-family:var(--display);font-size:24px;font-weight:800;margin-top:4px;font-variant-numeric:tabular-nums}
.kpi .sm{font-size:13px;color:var(--muted);margin-top:4px}
.pill{display:inline-block;font-size:12.5px;font-weight:700;padding:3px 10px;border-radius:999px;color:#fff;margin-top:6px}
.famhead{display:flex;align-items:center;gap:10px;margin:0 0 12px}
.famhead i{width:12px;height:12px;border-radius:50%}
.famhead h3{margin:0;font-family:var(--display);font-size:18px}
.big{border-radius:16px;padding:16px 18px;color:#fff}
.big .lb{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;opacity:.9}
.big .vl{font-family:var(--display);font-size:34px;font-weight:800;line-height:1.15}
.big .sm{font-size:13.5px;opacity:.92}
.bar{position:relative;height:9px;border-radius:9px;background:rgba(255,255,255,.3);margin-top:10px;overflow:visible}
.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:9px;background:#fff}
.bar b{position:absolute;top:-4px;bottom:-4px;width:3px;background:#0E2A47;border-radius:2px}
.bar-note{font-size:12px;opacity:.9;margin-top:6px}
/* tabelas */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:14px}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:14.5px}
th,td{padding:9px 12px;text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
thead th{background:var(--navy);color:#fff;font-family:var(--display);font-weight:600;font-size:13px}
thead tr.s th{background:#1D467E;font-size:11.5px;letter-spacing:.04em}
tbody td{border-top:1px solid var(--line)}
td.g,th.g{border-left:2px solid rgba(255,255,255,.25)}
tbody td.g{border-left:2px solid var(--line)}
.na{color:var(--muted)}
/* atenção */
.att{list-style:none;margin:0;padding:0}
.att li{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:12px;margin-bottom:8px;background:#FFF6E6;border:1px solid #F5D49A}
.att li.bad{background:#FDECEC;border-color:#F2B8B8}
.att li.ok{background:#E8F6EC;border-color:#B8E2C5}
.att li span:first-child{font-size:18px;line-height:1.2}
/* notas sem crm */
.nfbox{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.nfnum{font-family:var(--display);font-size:46px;font-weight:800;line-height:1;color:var(--bad)}
.nfnum.zero{color:var(--ok)}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);font-weight:700;border-radius:10px;padding:9px 16px;cursor:pointer}
.btn:hover{border-color:var(--navy)}
.btn.verde{background:#14532D;border-color:#14532D;color:#fff}
.btn.ouro{background:#9A7B00;border-color:#9A7B00;color:#fff}
.btn.laranja{background:var(--orange);border-color:var(--orange);color:#fff}
.btn:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
.feed{list-style:none;margin:0;padding:0}
.feed li{display:flex;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:14.5px}
.feed li:first-child{border-top:0}
.feed .h{margin-left:auto;color:var(--muted);font-size:13px}
.feed i{width:9px;height:9px;border-radius:50%;margin-top:6px;flex:none}
/* vendas */
.race{display:grid;gap:16px}
.rc{display:grid;grid-template-columns:230px 1fr;gap:14px;align-items:end}
.rc .nm{font-weight:700;font-size:13.5px;text-transform:uppercase;line-height:1.25}
.rc .nm small{display:block;font-family:var(--display);font-size:13px}
.rc.me .nm{color:var(--orange)}
.trk{position:relative;height:40px;border-radius:12px;overflow:visible}
.trk .bg{position:absolute;inset:0;border-radius:12px}
.trk .fill{position:absolute;left:0;top:0;bottom:0;background:#45D35B;border-radius:12px 0 0 12px}
.trk .pc{position:absolute;top:50%;transform:translateY(-50%);font-family:var(--display);font-weight:800;font-size:16px}
.trk img{position:absolute;bottom:34px;width:76px;transform:translateX(-60%)}
.rc.me .trk .bg{box-shadow:inset 0 0 0 3px var(--orange)}
.perf .trk{height:44px}
.perf .lbl{text-align:center;font-weight:700;font-size:13px;color:var(--muted);letter-spacing:.05em;margin:6px 0 18px}
.alerta{text-align:center;font-weight:800;color:#9B1C1C;margin-top:4px}
.alerta.ok{color:#14532D}
tr.meu td{background:#FFF4E5}
tr.tot td{background:#E7F0E2;font-weight:800}
tr.hub td{background:#FFFBD6}
.fams{display:block;font-size:12px;color:var(--muted);font-weight:500}
.pct{display:inline-block;padding:2px 9px;border-radius:999px;font-weight:700;font-size:12.5px}
.pct.v{background:#E3F5E8;color:#1E7A3C}
.pct.r{background:#FCE7E7;color:#B42318}
/* modal */
.modal{position:fixed;inset:0;background:rgba(10,25,45,.55);display:flex;align-items:flex-start;justify-content:center;padding:30px 14px;z-index:50;overflow:auto}
.modal .box{background:#fff;border-radius:16px;max-width:1100px;width:100%;padding:18px 20px}
.modal .box header{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
.modal h3{margin:0;font-family:var(--display)}
/* individual */
.selrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.selrow select{padding:9px 12px;border-radius:10px;border:1px solid var(--line);min-width:280px;background:#fff}
.kpi.lr{border-left:4px solid var(--fam)}
/* ajuste */
.form{display:grid;gap:12px;max-width:720px}
.form label{font-weight:700;font-size:14px;display:grid;gap:6px}
.form select,.form textarea,.form input{padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;font-weight:500}
.form textarea{min-height:230px;resize:vertical}
.okmsg{background:#E8F6EC;border:1px solid #B8E2C5;border-radius:12px;padding:12px 14px}
.errmsg{background:#FDECEC;border:1px solid #F2B8B8;border-radius:12px;padding:12px 14px}
.prio{border:0;padding:0;margin:0;display:flex;gap:10px;flex-wrap:wrap}
.prio legend{font-weight:700;font-size:14px;margin-bottom:6px;padding:0}
.pr{display:inline-flex!important;align-items:center;cursor:pointer}
.pr input{position:absolute;opacity:0;pointer-events:none}
.pr span{padding:9px 22px;border-radius:999px;font-weight:700;border:2px solid transparent;opacity:.55}
.pr.baixa span{background:#DDF3E3;color:#1E7A3C;border-color:#2E9E4F}
.pr.media span{background:#FFF3CC;color:#8A6400;border-color:#E0A800}
.pr.alta span{background:#FCE1E1;color:#B42318;border-color:#D64545}
.pr input:checked + span{opacity:1;box-shadow:0 0 0 3px rgba(15,45,92,.15)}
.pr.baixa input:checked + span{background:#2E9E4F;color:#fff}
.pr.media input:checked + span{background:#E0A800;color:#fff}
.pr.alta input:checked + span{background:#D64545;color:#fff}
.pr input:focus-visible + span{outline:3px solid var(--orange);outline-offset:2px}
.form textarea{min-height:200px}
.btn.vermelho-g{background:#D64545;border-color:#D64545;color:#fff;font-size:16px;padding:12px 22px;box-shadow:0 6px 16px rgba(214,69,69,.3)}
.btn.vermelho-g:hover{background:#B83434}
.pm{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.pm-ctrl{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.pm-ctrl select,.pm-ctrl input,.pm-ctrl textarea{padding:8px 10px;border:1px solid var(--line);border-radius:9px;font:inherit}
.pm-ctrl textarea{width:100%;min-height:60px}
.novo-ler{width:100%;background:#EFE7FB;border:2px dashed #8E5BD6;color:#5A2F9E;margin-top:8px}
.sup-intro{font-size:16px;margin:4px 0 12px}
.sup-aviso{display:flex;gap:10px;align-items:flex-start;background:#EAF2FB;border:1px solid #9CC0E8;border-left:5px solid #1D5FAF;border-radius:12px;padding:12px 14px;margin-bottom:16px;font-size:14.5px}
.sup-btns{display:flex;gap:8px;flex-wrap:wrap}
.btn.azul{background:#1D5FAF;border-color:#1D5FAF;color:#fff;text-decoration:none;font-size:13.5px}
.btn.azul:hover{background:#174D8F}
.sup-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:16px}
.sup-card{border:1px solid var(--line);border-radius:16px;padding:16px 18px;background:#fff}
.sup-top{display:flex;gap:16px;align-items:center}
.sup-top img{width:96px;height:96px;border-radius:50%;object-fit:cover;border:4px solid var(--orange);flex:none}
.sup-nome{font-family:var(--display);font-size:19px;font-weight:800}
.sup-cargo{color:var(--muted);font-size:14px;margin:2px 0 10px}
.sup-top .btn{text-transform:uppercase;letter-spacing:.03em;font-size:13.5px}
.sup-areas{list-style:none;margin:14px 0 0;padding:0;display:grid;gap:3px}
.sup-areas li{font-size:13px;color:var(--muted);border-left:3px solid var(--orange);padding-left:8px;line-height:1.35}
.sup-para{display:flex;gap:12px;align-items:center;margin-bottom:14px}
.sup-para img{width:54px;height:54px;border-radius:50%;object-fit:cover;border:3px solid var(--orange)}
.crit{font-size:13.5px;color:var(--muted);margin-top:-4px}
.resp-v{margin-top:6px;background:#F2FBF5;border-radius:8px;padding:6px 10px;font-size:13.5px}
.th-card{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.th-foto{width:110px;height:110px;border-radius:50%;object-fit:cover;border:4px solid var(--orange);box-shadow:0 0 0 4px #fff;flex:none}
.th-ini{display:grid;place-items:center;background:var(--navy);color:#fff;font-family:var(--display);font-weight:800;font-size:34px}
.th-nome{font-family:var(--display);font-size:24px;font-weight:800}
fieldset.prio{border:0;padding:0;margin:0;display:flex;gap:10px;flex-wrap:wrap}
fieldset.prio legend{font-weight:700;font-size:14px;margin-bottom:6px;padding:0}
fieldset.prio label{display:flex;align-items:center;gap:8px;cursor:pointer;font-weight:700;border-radius:12px;padding:9px 16px;border:2px solid transparent}
fieldset.prio input{accent-color:currentColor;width:18px;height:18px}
.p-baixa{background:#E3F5E8;color:#1E7A3C}
.p-media{background:#FFF4CC;color:#8A6400}
.p-alta{background:#FCE7E7;color:#B42318}
fieldset.prio label:has(input:checked){border-color:currentColor}
.okmsg b{font-size:16px}
.filtro{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.seg{display:inline-flex;background:#fff;border:1px solid var(--line);border-radius:12px;padding:4px;gap:4px}
.seg button{border:0;background:transparent;font-weight:700;color:var(--muted);padding:9px 20px;border-radius:9px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--navy);color:#fff}
.fsel{display:grid;gap:4px;font-size:12.5px;color:var(--muted);font-weight:600}
.fsel select{padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:#fff;font-weight:600;color:var(--ink);min-width:190px}
.fsel input[type=date]{padding:9px 12px;border-radius:12px;border:1px solid var(--line);background:#fff;font-weight:600;color:var(--ink);font-family:inherit;min-height:42px}
.pace{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 16px;font-size:15px}
.nfalert{border:3px solid var(--bad);background:#FFF5F5}
.nfalert.ok{border-color:var(--ok);background:#F2FBF5}
.nfalert-h{display:flex;gap:14px;align-items:center}
.nfalert-ic{font-size:44px;line-height:1}
.nfalert-t{font-family:var(--display);font-weight:800;font-size:clamp(20px,2.4vw,26px);color:#9B1C1C;text-transform:uppercase;letter-spacing:.01em}
.nfalert.ok .nfalert-t{color:#14532D}
.ifr-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px;font-weight:700;color:var(--muted);font-size:14px}
.ifr-top a{text-decoration:none}
iframe.tat{width:100%;height:calc(100vh - 120px);min-height:900px;border:0;border-radius:18px;background:#fff;display:block}
.gate{max-width:560px;margin:60px auto;text-align:center}
.gate .card{padding:30px}
.foot{font-size:12.5px;color:var(--muted);margin-top:6px}
.loading{padding:40px;text-align:center;color:var(--muted)}
.gbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:#FFF4E5;border:1px solid var(--orange);border-radius:12px;padding:8px 14px;margin-bottom:12px;font-weight:700}
.gbar select{padding:7px 10px;border-radius:9px;border:1px solid var(--line);font-weight:600;min-width:220px}
</style>
</head>

function mesmoNome(a, b){ // compara pelo primeiro e último nome
  const x = norm(a).split(' '), y = norm(b).split(' ');

/* ---------------- dados ---------------- */
function carregarScript(src){ return new Promise((ok, erro) => { const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = erro; document.head.appendChild(s); }); }
function extrairDATA(html){
  const m = html.match(/const DATA\s*=\s*\{/); if (!m) return null;
  let i = m.index + m[0].length - 1, prof = 0, txt = false, e = false;
  for (let j = i; j < html.length; j++){ const c = html[j];
    if (txt){ if (e) e = false; else if (c === '\\') e = true; else if (c === '"') txt = false; }
    else if (c === '"') txt = true; else if (c === '{') prof++; else if (c === '}' && --prof === 0) return JSON.parse(html.slice(i, j+1)); }
  return null;
}
async function carregarCRM(){
  delete window.ESFORCO_DATA;
  await carregarScript('esforco_data.js?v=' + Date.now());
  D = window.ESFORCO_DATA || null;
}
async function carregarVendas(arquivo){
  const r = await fetch(arquivo + '?v=' + Date.now(), {cache:'no-store'});
  VD = extrairDATA(await r.text());
}
async function carregarMeses(){
  try { const r = await fetch('meses.json?v=' + Date.now(), {cache:'no-store'}); MESES_V = (await r.json()).slice().sort((a,b) => a.id < b.id ? 1 : -1); }
  catch(e){ MESES_V = [{id:'atual', label:'Mês atual', arquivo:'index.html'}]; }
  if (!MES_V || !MESES_V.some(m => m.id === MES_V.id)) MES_V = MESES_V.find(m => m.arquivo === 'index.html') || MESES_V[0];
}

/* ---------------- CRM: utilitários (mesma regra do painel de esforço) ---------------- */
let FER = {}, ROWS = [], HOJE = '', FAMID = {}, VIDX = -1, LIG_EM_CONTATO = true, META_INICIO = '2026-10';
const iso = d => d.toISOString().slice(0,10), parse = s => new Date(s + 'T00:00:00Z');
const addDays = (d,n) => { const x = new Date(d.getTime()); x.setUTCDate(x.getUTCDate()+n); return x; };
const monStart = d => addDays(d, -((d.getUTCDay()+6)%7));
const dm = s => s.slice(8,10) + '/' + s.slice(5,7);
const isBiz = d => { const w = d.getUTCDay(); return w !== 0 && w !== 6 && !FER[iso(d)]; };
function bizDays(a,b){ if (b < a) return 0; let n = 0; for (let d = parse(a); iso(d) <= b; d = addDays(d,1)) if (isBiz(d)) n++; return n; }
const METRICAS = [{k:'carteira',nome:'Contato (carteira)'},{k:'novos',nome:'Contato (cliente novo)'},{k:'visita',nome:'Teste / visita'},{k:'ligacao',nome:'Ligação'}];
function prepararCRM(){
  FER = {}; (D.config.feriados||[]).forEach(f => FER[f] = 1);
  HOJE = D.meta.hoje; LIG_EM_CONTATO = D.config.ligacaoContaComoContato !== false; META_INICIO = D.config.metasDesde || '2026-10';
  ROWS = D.atividades.map(a => ({d:a[0], f:a[1], v:a[2], c:D.canais[a[3]], t:D.tipos[a[4]], q:a[5]}));
  FAMID = {}; D.familias.forEach((f,i) => FAMID[f.id] = i);
  VIDX = D.vendedores.findIndex(n => mesmoNome(n, V.crm));
}
function soma(o){ let t = 0; for (const r of ROWS){ if (o.from && r.d < o.from) continue; if (o.to && r.d > o.to) continue;
  if (o.f != null && r.f !== o.f) continue; if (o.v != null && r.v !== o.v) continue; if (o.tipo && r.t !== o.tipo) continue;
  if (o.canais && o.canais.indexOf(r.c) < 0) continue; t += r.q; } return t; }
function canaisDa(fi, m){ const fam = D.familias[fi];
  if (m === 'carteira' || m === 'novos') return D.canais.slice();   // toda tarefa conta no contato do tipo do cliente (mesma regra do dash)
  if (m === 'visita') return ['visita']; return ['ligacao','ligacao_nao']; }
const realiz = (fi,m,from,to,v) => soma({from, to, f:fi, v, canais:canaisDa(fi,m), tipo: m === 'carteira' ? 'carteira' : m === 'novos' ? 'novo' : null});
const metaPer = (sem,from,to) => sem * bizDays(from,to) / 5;
function metasDe(ent, mes){ const mpm = ent.metasPorMes; if (!mpm) return mes >= META_INICIO ? ent.metas : null;
  const ks = Object.keys(mpm).sort().filter(k => k <= mes); return ks.length ? mpm[ks[ks.length-1]] : null; }
function progresso(it){ let m = 0, r = 0; it.forEach(x => { m += x.meta; r += Math.min(x.real, x.meta); }); return m > 0 ? r / m : null; }
const hubSoma = (k,from,to) => (D.hubRegistros||[]).reduce((t,h) => t + (h[1] === k && h[0] >= from && h[0] <= to ? h[2] : 0), 0);
/* períodos: semana atual ou um mês (igual ao filtro Mês/Semana do painel de esforço) */
let MODO_CRM = (() => { try { return localStorage.getItem('portal_modo') || 'semana'; } catch(e){ return 'semana'; } })();
let MES_CRM = null;
if (!['mes','semana','periodo'].includes(MODO_CRM)) MODO_CRM = 'semana';
let SEM_CRM = null, DE_CRM = '', ATE_CRM = '';
try { const sv = localStorage.getItem('portal_sem'); if (sv && sv !== 'atual') SEM_CRM = sv; DE_CRM = localStorage.getItem('portal_de') || ''; ATE_CRM = localStorage.getItem('portal_ate') || ''; } catch(e){}
function perSemana(ini){   // sem argumento = semana atual; com argumento = a semana que começa naquela segunda-feira
  const s = ini ? parse(ini) : monStart(parse(HOJE)), e = addDays(s,6), to = iso(e);
  return {tipo:'semana', from: iso(s), to, upTo: HOJE < to ? HOJE : to, mesRef: ini ? iso(s).slice(0,7) : HOJE.slice(0,7), nome: `Semana de ${dm(iso(s))} a ${dm(iso(addDays(s,4)))}`};
}
const dmy = s => s.slice(8,10) + '/' + s.slice(5,7) + '/' + s.slice(0,4);
function perPeriodo(de, ate){
  let a = de, b = ate; if (a > b){ const t = a; a = b; b = t; }
  return {tipo:'periodo', from: a, to: b, upTo: HOJE < b ? HOJE : b, mesRef: a.slice(0,7), nome: `Período de ${dmy(a)} a ${dmy(b)}`};
}
function semanasCRM(){ // da semana atual (primeira) até a primeira semana com dados
  const out = [], ini = monStart(parse((D.config.inicio || HOJE).slice(0,10)));
  for (let d = monStart(parse(HOJE)); d >= ini && out.length < 80; d = addDays(d,-7)) out.push(iso(d));
  return out;
}
const PRESETS = [['','Atalhos…'],['esta_semana','Esta semana'],['semana_passada','Semana passada'],['ult7','Últimos 7 dias'],['ult14','Últimos 14 dias'],['ult30','Últimos 30 dias'],['este_mes','Este mês'],['mes_passado','Mês passado'],['este_trim','Este trimestre']];
function rangePreset(p){
  const h = parse(HOJE), y = h.getUTCFullYear(), m = h.getUTCMonth(), s = monStart(h), q = Math.floor(m/3)*3;
  const R = { esta_semana:[s,addDays(s,6)], semana_passada:[addDays(s,-7),addDays(s,-1)], ult7:[addDays(h,-6),h], ult14:[addDays(h,-13),h], ult30:[addDays(h,-29),h],
    este_mes:[new Date(Date.UTC(y,m,1)),new Date(Date.UTC(y,m+1,0))], mes_passado:[new Date(Date.UTC(y,m-1,1)),new Date(Date.UTC(y,m,0))],
    este_trim:[new Date(Date.UTC(y,q,1)),new Date(Date.UTC(y,q+3,0))] }[p];
  return R ? {de: iso(R[0]), ate: iso(R[1])} : null;
}
/* metas num intervalo qualquer: cada mês do intervalo usa as metas vigentes dele (meta semanal × dias úteis ÷ 5) */
function mesesDoIntervalo(from, to){ const out = []; let cur = from; while (cur <= to){ const mes = cur.slice(0,7), fim = iso(new Date(Date.UTC(+mes.slice(0,4), +mes.slice(5,7), 0))), f = fim < to ? fim : to; out.push([mes, cur, f]); cur = iso(addDays(parse(f),1)); } return out; }
const temMeta = (ent, from, to) => mesesDoIntervalo(from, to).some(x => !!metasDe(ent, x[0]));
function metaIntervalo(ent, k, from, to){ let tot = null; mesesDoIntervalo(from, to).forEach(x => { const mt = metasDe(ent, x[0]); if (mt && mt[k] != null) tot = (tot || 0) + metaPer(mt[k], x[1], x[2]); }); return tot; }
function perMes(id){
  const y = +id.slice(0,4), m = +id.slice(5,7), from = iso(new Date(Date.UTC(y,m-1,1))), to = iso(new Date(Date.UTC(y,m,0)));
  return {tipo:'mes', from, to, upTo: HOJE < to ? HOJE : to, mesRef: id, nome: `${MESES_LONGO[m-1]} de ${y}`};
}
function mesesCRM(){ // do início dos dados até o mês atual, mais recente primeiro
  const out = [], ini = (D.config.inicio || HOJE).slice(0,7); let y = +HOJE.slice(0,4), m = +HOJE.slice(5,7);
  while (true){ const id = `${y}-${String(m).padStart(2,'0')}`; out.push(id); if (id <= ini || out.length > 36) break; m--; if (!m){ m = 12; y--; } }
  return out;
}
function blocoFamilia(fid, per){
  if (fid === 'hub'){
    const h = D.hub, tem = temMeta(h, per.from, per.to);
    const its = [['anuncio','Anúncio de produto'],['licitacao','Licitações participadas']].map(([k,nome]) => {
      return { nome, meta: tem ? metaIntervalo(h, k, per.from, per.to) : null, real: hubSoma(k, per.from, per.upTo) }; });
    return { f: {id:'hub', nome: h.nome, cor: h.cor}, its, semMeta: !tem };
  }
  const fi = FAMID[fid]; if (fi == null) return null;
  const f = D.familias[fi], tem = temMeta(f, per.from, per.to);
  const its = METRICAS.map(m => {
    return { nome: m.nome, meta: tem ? metaIntervalo(f, m.k, per.from, per.to) : null, real: realiz(fi, m.k, per.from, per.upTo) }; });
  return { f, fi, its, semMeta: !tem };
}
const esperado = per => { const t = bizDays(per.from, per.to); return t ? bizDays(per.from, per.upTo) / t : 0; };
const progBloco = b => progresso(b.its.filter(i => i.meta != null));

function pontosDeAtencao(){
  const at = [], ps = perSemana(), pm = perMes(HOJE.slice(0,7)), eS = esperado(ps), eM = esperado(pm);
  V.famCrm.forEach(fid => {
    const bs = blocoFamilia(fid, ps), bm = blocoFamilia(fid, pm); if (!bs) return;
    const xs = progBloco(bs), xm = progBloco(bm);
    if (xs != null && eS >= .2 && xs < eS * .8) at.push(['bad', `<b>${esc(bs.f.nome)} · semana:</b> ${P(xs)} da meta feita, o esperado até hoje é ${P(eS)}.`]);
    if (xm != null && eM >= .2 && xm < eM * .8) at.push(['bad', `<b>${esc(bm.f.nome)} · mês:</b> ${P(xm)} da meta feita, o esperado até hoje é ${P(eM)}.`]);
    const zerados = bs.its.filter(i => i.meta >= 1 && i.real === 0).map(i => i.nome);
    if (eS >= .4 && zerados.length && xs !== 0) at.push(['', `<b>${esc(bs.f.nome)}:</b> sem registro nesta semana em ${esc(zerados.join(', '))}.`]);
  });
  { // última ação registrada no CRM pela família (todos os vendedores dela)
    const fis = V.famCrm.map(f => FAMID[f]).filter(x => x != null);
    if (fis.length){
      const ult = ROWS.filter(r => fis.includes(r.f) && r.d <= HOJE).reduce((m,r) => r.d > m ? r.d : m, '');
      let d = addDays(parse(HOJE), -1); while (!isBiz(d)) d = addDays(d,-1); const ontem = iso(d);
      if (!ult) at.push(['bad', 'Nenhuma ação da família registrada no CRM ainda.']);
      else if (ult < ontem) at.push(['', `A última ação da família registrada no CRM foi em <b>${dm(ult)}</b>.`]);
    }
  }
  if (VD) gruposDoVendedor().forEach(g => { const t = VD.totais || {}; const p = g.realizado_pct, e = t.esperado_pct;
    if (p != null && e != null && e >= .2 && p < e * .8) at.push(['', `<b>Faturamento ${esc(nomeGrupo(g))}:</b> ${P(p)} da meta, esperado ${P(e)} até hoje.`]); });
  return at;
}

  const fc = {}; D.familias.forEach(f => fc[f.id] = f.cor);
  const feed = (D.recentes||[]).filter(r => V.famCrm.includes(r.f)).slice(0,12);

  const g = gs.find(x => x.id === sel) || gs[0];
  const fat = g.faturado_total||0, prev = g.previsto_total||0, falta = Math.max(0, g.meta - fat - prev);

    <div class="selrow"><b>Ver meta de:</b><select id="selGrupo">${gs.map(x => `<option value="${x.id}" ${x.id === g.id ? 'selected' : ''}>${esc(nomeGrupo(x))}</option>`).join('')}</select></div>
    <div class="grid4"><div class="kpi lr"><div class="lb">Meta (família)</div><div class="vl">${R(g.meta)}</div></div>
      <div class="kpi lr"><div class="lb">Faturado</div><div class="vl" style="color:#14532D">${R(fat)}</div></div>
      <div class="kpi lr"><div class="lb">Previsto</div><div class="vl" style="color:#8A6D00">${R(prev)}</div></div>
      <div class="kpi lr"><div class="lb">Falta para a meta</div><div class="vl" style="color:#B42318">${R(falta)}</div></div></div>
    <div class="grid3" style="margin-top:12px"><div class="kpi lr"><div class="lb">Faturado %</div><div class="vl" style="font-size:20px">${P(fat/g.meta)}</div></div>
      <div class="kpi lr"><div class="lb">Previsto %</div><div class="vl" style="font-size:20px">${P(prev/g.meta)}</div></div>
      <div class="kpi lr"><div class="lb">Falta %</div><div class="vl" style="font-size:20px">${P(falta/g.meta)}</div></div></div>
    <p style="margin:16px 0 10px"><b>Só de ${esc(V.nome)}:</b> Faturado ${R(meuF)} · Previsto ${R(meuP)} <span class="foot">(o restante do grupo é de outro(s) vendedor(es) responsável(is) pela mesma meta)</span></p>
    <div class="tw"><table><thead><tr><th>Família de produto</th><th>Meta</th><th>Faturado (seu)</th><th>Previsto (seu)</th><th>% Faturado</th><th>% Falta</th></tr></thead><tbody>${
      gs.map(x => { const f = meuValor(VD.vend_fam_real, x), p = meuValor(VD.vend_fam_prev, x);
        return `<tr><td>${esc(nomeGrupo(x))}</td><td>${R(x.meta)}</td><td>${R(f)}</td><td>${R(p)}</td><td><span class="pct v">${P(f/x.meta)}</span></td><td><span class="pct r">${P(1 - f/x.meta)}</span></td></tr>`; }).join('')}</tbody></table></div></div>`;
  $('selGrupo').onchange = e => renderMeu(e.target.value);
}

function renderTatico(){
  const el = $('tab-tatico');
  if (!el.dataset.ok){ const src = `numeros-tatico.html?f=${encodeURIComponent(V.tatico)}`;
    el.innerHTML = `<div class="ifr-top"><span>Números para o Tático · ${esc(V.setor)}</span><a class="btn" href="${src}" target="_blank" rel="noopener">Abrir em nova aba ↗</a></div>
      <iframe class="tat" src="${src}" title="Números para o Tático"></iframe>`; el.dataset.ok = '1'; }
}
const STV = { NOVO:'Aguardando visualização', VISTO:'Visualizado pelo Gabriel Saenz', PENDENTE:'Direcionado', ABERTO:'Em aberto', ANDAMENTO:'Em andamento', FINAL:'Em fase final', CONCLUIDO:'Concluído', CANCELADO:'Cancelado' };
const stCor = s => ({'Aguardando visualização':['#E8ECF3','#33415C'],'Visualizado pelo Gabriel Saenz':['#E3EEFB','#1D5FAF'],'Direcionado':['#EFE7FB','#6B3FB5'],'Em aberto':['#E3EEFB','#1D5FAF'],'Em andamento':['#FFF0DC','#A85A00'],
  'Em fase final':['#DDF4F1','#0E7C6B'],'Concluído':['#E3F5E8','#1E7A3C'],'Cancelado':['#EEF1F5','#5B6B80']})[s] || ['#EEF1F5','#5B6B80'];
const stPill = (s, c) => { const [bg, fg] = stCor(s); return `<span class="pct" style="background:${bg};color:${fg}">${esc(s === STV.PENDENTE && c && c.paraNome ? 'Direcionado para: ' + c.paraNome : s)}</span>`; };
const dtc = s => s ? new Date(s).toLocaleString('pt-BR', {day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit'}) : '—';
function renderAjuste(){
  const el = $('tab-ajuste'), EQ = window.SUPORTE || [];
  el.innerHTML = `<div class="card"><h2>Suporte / Ajuda</h2><p class="sup-intro">Está com alguma dúvida, precisa de algum dado, ou alguma informação precisa de ajuste?</p>
    <button class="btn vermelho-g" id="abrirCh">+ Abrir chamado / Solicitar ajuda</button>
    <p class="crit" style="margin:8px 0 14px">Todo chamado cai para o <b>Gabriel Saenz</b>, que direciona para a pessoa certa (veja abaixo quem faz o quê). Você acompanha o andamento aqui mesmo, em <b>"Minhas solicitações"</b>.</p>
    <div class="sup-aviso"><span aria-hidden="true">ℹ️</span><div><b>Esta aba é somente para chamados de ajuste ou ajuda (suporte).</b><br>
      Não use para solicitar compra ou solicitar frete: esses pedidos seguem pelo processo normal de cada área.</div></div>
    <h3 style="font-family:var(--display);margin:6px 0 10px;font-size:16px">Quem faz o quê</h3>

        <div class="sup-nome">${esc(p.nome)}</div><div class="sup-cargo">${esc(p.cargo)}</div>
        ${p.botao ? `<div class="sup-btns"><a class="btn azul" href="${esc(p.botao.url)}" target="_blank" rel="noopener">${esc(p.botao.texto)} ↗</a></div>` : ''}</div></div>
        <ul class="sup-areas">${p.areas.map(a => `<li>${esc(a)}</li>`).join('')}</ul></div>`).join('')}</div></div>
    <div class="card hidden" id="paraMimCard"><h2>Chamados direcionados a você</h2><p class="sub">O Gabriel Saenz direcionou estes chamados para você. Abra, leia e atualize o andamento.</p><div id="paraMim"></div></div>
    <div class="card" id="minhas"><h2>Minhas solicitações</h2><div id="minhasLista" class="sub">Carregando…</div></div>`;
  $('abrirCh').onclick = () => formSuporte();
  minhasSolicitacoes();
}
function formSuporte(){
  const CRIT = window.SUPORTE_CRITERIOS || {}, SETORES = ['Plásticos de Engenharia','Adesivos Estruturais','Especialidades','Pigatto Hub + Licitação','Papéis + Etiquetas'];
  const nomes = (window.VENDEDORES||[]).map(v => v.nome);

  $('mBody').innerHTML = `<p class="crit" style="margin:-4px 0 12px">Somente ajuste ou ajuda (suporte). Pedidos de compra ou de frete não são feitos por aqui. O Gabriel Saenz recebe e direciona para o responsável.</p>
    <div class="form">
      <label>Nome<select id="aNome">${nomes.map(n => `<option ${n === V.nome ? 'selected' : ''}>${esc(n)}</option>`).join('')}<option value="__outro">Outros</option></select></label>
      <label id="aOutroBox" class="hidden">Escreva o seu nome<input id="aOutro" autocomplete="name"></label>
      <label>Setor<select id="aSetor">${SETORES.map(x => `<option ${x === V.setor ? 'selected' : ''}>${esc(x)}</option>`).join('')}</select></label>
      <fieldset class="prio"><legend>Urgência</legend>
        <label class="p-baixa"><input type="radio" name="aPrio" value="Baixa" checked><span>Baixa</span></label>
        <label class="p-media"><input type="radio" name="aPrio" value="Média"><span>Média</span></label>
        <label class="p-alta"><input type="radio" name="aPrio" value="Alta"><span>Alta</span></label></fieldset>
      <div class="crit" id="aCrit"></div>
      <label>Qual a solicitação?<textarea id="aMsg" placeholder="Descreva com detalhes o que precisa (cliente, pedido, nota, produto…)."></textarea></label>
      <label>Seu e-mail<input id="aEmail" type="email" autocomplete="email" placeholder="nome@pigattodistribuidora.com.br"></label>
      <div><button class="btn vermelho-g" id="aEnviar">Enviar chamado</button></div><div id="aRes"></div></div>`;
  $('modal').classList.remove('hidden');
  try { const e = localStorage.getItem('portal_email'); if (e) $('aEmail').value = e; } catch(e){}
  const crit = () => { const u = (document.querySelector('input[name="aPrio"]:checked') || {}).value; $('aCrit').textContent = CRIT[u] || ''; };
  document.querySelectorAll('input[name="aPrio"]').forEach(r => r.onchange = crit); crit();
  $('aNome').onchange = () => $('aOutroBox').classList.toggle('hidden', $('aNome').value !== '__outro');
  $('aEnviar').onclick = async () => {
    const nome = $('aNome').value === '__outro' ? $('aOutro').value.trim() : $('aNome').value;
    const msg = $('aMsg').value.trim(), email = $('aEmail').value.trim(), urg = (document.querySelector('input[name="aPrio"]:checked') || {}).value || 'Baixa';
    if (!nome){ alert('Escreva o seu nome.'); $('aOutro').focus(); return; }
    if (msg.length < 5){ alert('Descreva a solicitação antes de enviar.'); $('aMsg').focus(); return; }
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){ alert('Informe um e-mail válido para receber o retorno.'); $('aEmail').focus(); return; }
    try { localStorage.setItem('portal_email', email); } catch(e){}
    const corpo = { acao:'chamado', nome, setor:$('aSetor').value, urgencia:urg, solicitacao:msg, email, k:K, pagina:'Portal do vendedor · link de ' + V.nome };
    const btn = $('aEnviar'); btn.disabled = true; btn.textContent = 'Enviando…';
    try { const r = await fetch(API_CHAMADOS, { method:'POST', body: JSON.stringify(corpo) }); const j = await r.json(); if (!j.ok) throw new Error(j.erro || 'erro');
      $('mBody').innerHTML = `<div class="okmsg" style="font-size:16px">✅ <b>Chamado aberto! Protocolo ${esc(j.protocolo)}.</b><br>
        O <b>Gabriel Saenz</b> vai direcionar para o responsável, e você recebe o retorno por e-mail.<br>
        Você pode acompanhar a sua solicitação em: <b>seu Portal do Vendedor → aba Suporte/Ajuda → "Minhas solicitações"</b>.</div>
        <p style="margin-top:14px"><button class="btn" onclick="document.getElementById('modal').classList.add('hidden')">Fechar</button></p>`;
      minhasSolicitacoes(); }
    catch(e){ const mailto = `mailto:gabriel.saenz@grupopigatto.com.br?subject=${encodeURIComponent(`[${urg}] Chamado — ${nome}`)}&body=${encodeURIComponent(`Nome: ${nome}\nSetor: ${corpo.setor}\nUrgência: ${urg}\nE-mail: ${email}\n\n${msg}`)}`;
      $('aRes').innerHTML = `<div class="errmsg">Não foi possível enviar agora. <a href="${mailto}">Clique aqui para enviar por e-mail</a> com tudo já preenchido.</div>`; }
    finally { if ($('aEnviar')){ btn.disabled = false; btn.textContent = 'Enviar chamado'; } }
  };
}
async function minhasSolicitacoes(){
  const el = $('minhasLista'); if (!el) return;
  if (!K){ el.innerHTML = 'No modo gestão, as solicitações aparecem só no link pessoal do vendedor. Para ver todas, use a página CHAMADOS/SUPORTE.'; return; }
  let j; try { const r = await fetch(API_CHAMADOS, { method:'POST', body: JSON.stringify({ acao:'chamados-vendedor', k:K }) }); j = await r.json(); if (!j.ok) throw 0; }
  catch(e){ el.textContent = 'Não foi possível carregar as suas solicitações agora.'; return; }
  const agora = Date.now();
  el.innerHTML = j.chamados.length ? `<div class="tw"><table><thead><tr><th>Protocolo</th><th>Aberto em</th><th>Urgência</th><th>Situação</th><th>Responsável</th><th>Previsão</th><th style="text-align:left">Solicitação / andamento</th></tr></thead><tbody>${
    j.chamados.map(c => { const fim = c.status === STV.CONCLUIDO || c.status === STV.CANCELADO, venc = !fim && c.sla && new Date(c.sla) < agora;
      return `<tr><td>${esc(c.protocolo)}</td><td>${dtc(c.abertoEm)}</td><td>${esc(c.urgencia)}</td><td>${stPill(c.status, c)}${venc ? '<br><span class="foot" style="color:#B42318">prazo vencido</span>' : ''}</td>
        <td>${esc(c.paraNome || 'Gabriel Saenz (direcionando)')}</td><td>${esc(c.previsao || '—')}</td>
        <td style="text-align:left;white-space:normal;min-width:260px">${esc(c.solicitacao)}${c.andamento ? `<div class="resp-v"><b>${fim ? 'Resposta' : 'Andamento'}:</b> ${esc(c.andamento)}</div>` : ''}</td></tr>`; }).join('')}</tbody></table></div>` : 'Você ainda não abriu nenhuma solicitação.';
  const pm = j.paraMim || [], card = $('paraMimCard');
  if (card){ card.classList.toggle('hidden', !pm.length);
    $('paraMim').innerHTML = pm.map(c => { const fim = c.status === STV.CONCLUIDO || c.status === STV.CANCELADO, P = esc(c.protocolo);
      return `<div class="pm"><div><b>${P}</b> · ${esc(c.urgencia)} · ${stPill(c.status === STV.PENDENTE ? 'Novo para você' : c.status)} <span class="foot">· de ${esc(c.solicitante)} · ${dtc(c.abertoEm)}</span></div>
        ${c.status === STV.PENDENTE ? `<button class="btn novo-ler" data-ler="${P}">📩 Novo chamado para você · clique para abrir e ler</button>` : `<div style="margin-top:6px">${esc(c.solicitacao)}</div>
        ${c.orientacao ? `<div class="resp-v" style="background:#FFF4E5"><b>Orientação de ${esc(c.direcionadoPor || 'Gabriel Saenz')}:</b> ${esc(c.orientacao)}</div>` : ''}
        ${c.andamento ? `<div class="resp-v"><b>Último andamento:</b> ${esc(c.andamento)}</div>` : ''}
        ${fim ? '' : `<div class="pm-ctrl"><select data-st="${P}">${[STV.ABERTO, STV.ANDAMENTO, STV.FINAL, STV.CONCLUIDO, STV.CANCELADO].map(s => `<option ${s === c.status ? 'selected' : ''}>${s}</option>`).join('')}</select>
          <input data-prev="${P}" placeholder="Previsão (ex.: 2 dias)" value="${esc(c.previsao || '')}"><textarea data-com="${P}" placeholder="Andamento / resposta"></textarea>
          <button class="btn verde" data-at="${P}">Atualizar</button></div>`}`}</div>`; }).join('');
    const upd = async (corpo, b) => { b.disabled = true; try { const r = await fetch(API_CHAMADOS, { method:'POST', body: JSON.stringify({ acao:'chamado-vendedor-atualizar', k:K, ...corpo }) }); const x = await r.json(); if (!x.ok) throw 0; minhasSolicitacoes(); } catch(e){ alert('Não foi possível atualizar agora.'); b.disabled = false; } };
    document.querySelectorAll('#paraMim [data-ler]').forEach(b => b.onclick = () => upd({ protocolo:b.dataset.ler }, b));
    document.querySelectorAll('#paraMim [data-at]').forEach(b => b.onclick = () => { const P = b.dataset.at;
      upd({ protocolo:P, status:document.querySelector(`[data-st="${P}"]`).value, previsao:document.querySelector(`[data-prev="${P}"]`).value.trim(), comentario:document.querySelector(`[data-com="${P}"]`).value.trim() }, b); });
  }
}

  const el = $('tab-anuncios'); if (el.dataset.ok) return; el.dataset.ok = '1';
  el.innerHTML = '<div class="card" style="padding:0;overflow:hidden"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid #DDE7F0"><b>Registrar anúncios do Hub</b><a href="anuncios-hub.html" target="_blank" rel="noopener" style="font-size:13px">Abrir em tela cheia ↗</a></div>' +

function renderLicitacoes(){

    '<iframe src="licitacoes-hub.html" title="Licitações do Hub" style="width:100%;height:calc(100vh - 230px);min-height:640px;border:0;display:block"></iframe></div>';
  const ifr = el.querySelector('iframe'); ifr.addEventListener('load', () => { try { const h = ifr.contentDocument.querySelector('header'); if (h) h.style.display = 'none'; } catch(e){} });
}
function abrirAba(t){
  TAB = t;
  document.querySelectorAll('.nav button').forEach(b => b.setAttribute('aria-selected', b.dataset.tab === t));
  ['crm','vendas','meu','tatico','anuncios','licitacoes','ajuste'].forEach(x => $('tab-' + x).classList.toggle('hidden', x !== t));
  if (t === 'tatico') renderTatico();
  if (t === 'anuncios') renderAnuncios();
  if (t === 'licitacoes') renderLicitacoes();
  if (t === 'ajuste') minhasSolicitacoes();   // sempre busca a situação mais recente dos chamados
  window.scrollTo({top:0});
}
document.querySelectorAll('.nav button').forEach(b => b.onclick = () => abrirAba(b.dataset.tab));
function cabecalho(){
  const crm = D && D.meta ? new Date(D.meta.geradoEm) : null, mi = VD && VD.meta_info ? VD.meta_info : {};
  $('upd').innerHTML = `Atualizado: CRM ${crm ? crm.toLocaleDateString('pt-BR') + ' ' + crm.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}) : '—'} · Vendas ${esc(mi.atualizado_em || '—')}`;
}
async function atualizarTudo(){
  try { await carregarCRM(); if (D) prepararCRM(); } catch(e){ D = null; }
  try { await carregarMeses(); await carregarVendas(MES_V.arquivo); } catch(e){ VD = null; }
  cabecalho(); renderCRM(); renderVendas(); renderMeu();
}
async function iniciar(v){
  V = v;
  const famCor = (window.VENDEDORES_COR || {})[v.famCrm[0]] || ({plasticos:'#2E75B6',adesivos:'#D64545',especialidades:'#16A085',papeis:'#8E44AD',hub:'#E8A733'})[v.famCrm[0]] || '#2E75B6';
  document.documentElement.style.setProperty('--fam', famCor);
  $('meFoto').src = v.foto; $('meFoto').alt = 'Foto de ' + v.nome; $('meNome').textContent = v.nome; $('meSetor').textContent = v.setor;
  { const hub = ehDoHub(v); $('btnAnuncios').classList.toggle('hidden', !hub); $('btnLicitacoes').classList.toggle('hidden', !hub); const an = $('tab-anuncios'); an.innerHTML = ''; delete an.dataset.ok; const li = $('tab-licitacoes'); li.innerHTML = ''; delete li.dataset.ok; if (!hub && (TAB === 'anuncios' || TAB === 'licitacoes')) abrirAba('crm'); }   // a aba Anúncios é só do Hub
  { const aj = document.querySelector('.nav [data-tab=ajuste]'); if (aj) aj.classList.toggle('hidden', DASH); if (DASH && TAB === 'ajuste') abrirAba('crm'); }   // dentro do dash, o suporte é o botão SUPORTE do topo
  document.title = `Desempenho Comercial · ${v.nome}`;
  $('app').classList.remove('hidden');
  $('tab-crm').innerHTML = '<div class="card loading">Carregando os seus números…</div>';
  renderAjuste();
  const tat = $('tab-tatico'); tat.innerHTML = ''; delete tat.dataset.ok; if (TAB === 'tatico') renderTatico();
  await atualizarTudo();
  if (!window._timer) window._timer = setInterval(() => { if (TAB !== 'ajuste') atualizarTudo(); }, 10 * 60 * 1000);   // atualiza sozinho a cada 10 minutos
}
function modoGestao(i){
  const vs = window.VENDEDORES || [];
  $('gestaoBar').classList.remove('hidden');
  $('gestaoSel').innerHTML = vs.map((v,k) => `<option value="${k}" ${k === i ? 'selected' : ''}>${esc(v.nome)} · ${esc(v.setor)}</option>`).join('');
  $('gestaoSel').onchange = e => iniciar(vs[+e.target.value]);
  iniciar(vs[i]);
}
function dentroDoDashLiberado(){ // aberto pelo menu do dash, depois de digitar a senha 0201 lá
  try { return window.parent !== window && window.parent.location.pathname.endsWith('esforco.html') && sessionStorage.getItem('esf_ok') === '1'; }
  catch(e){ return false; }
}
(async () => {
  if (!window.crypto || !crypto.subtle){ portao('Abra este link pelo endereço https:// (o navegador bloqueou a verificação do link).'); return; }
  const v = await identificar();
  if (v === 'redir') return;
  if (v) iniciar(v);
  else if (dentroDoDashLiberado()) modoGestao(0);
  else portao('Este link não é válido ou está incompleto. Peça o seu link pessoal para a Thais Brito.');
})();
